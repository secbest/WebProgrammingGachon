<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Week 2 - Web Programming</title>
  <style>
    :root { --neon-pink: #ff2e97; --neon-cyan: #19e3ff; --bg: #12002b; --text: #f5e9ff; --muted: #b79ad6; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 24px; display: grid; place-items: center; overflow-x: hidden;
      font-family: "Inter", "Segoe UI", Arial, sans-serif; color: var(--text);
      background: linear-gradient(#12002b 0%, #3b0a64 55%, #ff2e97 130%) fixed;
    }
    /* scrolling perspective grid floor */
    body::before {
      content: ""; position: fixed; left: -50%; right: -50%; bottom: 0; height: 55vh; z-index: -1;
      background-image: linear-gradient(var(--neon-cyan) 1px, transparent 1px), linear-gradient(90deg, var(--neon-cyan) 1px, transparent 1px);
      background-size: 50px 50px; opacity: .35;
      transform: perspective(300px) rotateX(62deg); transform-origin: bottom; animation: floor 1.6s linear infinite;
      mask-image: linear-gradient(transparent, #000 70%);
    }
    @keyframes floor { to { background-position: 0 50px; } }
    .container { width: min(900px, 100%); }
    .header { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
    h1 {
      margin: 0; font-size: 2.4rem; text-transform: uppercase; letter-spacing: 6px; color: #fff;
      text-shadow: 0 0 8px var(--neon-pink), 0 0 22px var(--neon-pink), 0 0 44px var(--neon-pink);
      animation: flicker 4s infinite;
    }
    @keyframes flicker { 0%,19%,21%,60%,62%,100% { opacity: 1; } 20%,61% { opacity: .55; } 63% { opacity: .85; } }
    .back-link { color: var(--neon-cyan); text-decoration: none; font-weight: 700; text-shadow: 0 0 10px var(--neon-cyan); transition: letter-spacing .25s; }
    .back-link:hover { letter-spacing: 2px; }
    #search {
      width: 100%; padding: 13px 16px; margin-bottom: 22px; font-size: 1rem; color: var(--text);
      background: rgba(0,0,0,.35); border: 2px solid var(--neon-cyan); border-radius: 10px;
      box-shadow: 0 0 12px rgba(25,227,255,.4), inset 0 0 12px rgba(25,227,255,.15);
    }
    #search::placeholder { color: var(--muted); }
    #search:focus { outline: none; border-color: var(--neon-pink); box-shadow: 0 0 20px rgba(255,46,151,.7), inset 0 0 14px rgba(255,46,151,.2); }
    .section-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
    .section {
      padding: 18px; border-radius: 14px; background: rgba(18,0,43,.7); border: 2px solid var(--neon-pink);
      box-shadow: 0 0 18px rgba(255,46,151,.45), inset 0 0 18px rgba(255,46,151,.12);
      animation: slide .7s ease both; transition: transform .3s;
    }
    .section:nth-child(2) { border-color: var(--neon-cyan); box-shadow: 0 0 18px rgba(25,227,255,.45), inset 0 0 18px rgba(25,227,255,.12); animation-delay: .2s; }
    .section:hover { transform: translateY(-4px); }
    @keyframes slide { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: none; } }
    h2 { margin: 0 0 12px; font-size: 1rem; text-transform: uppercase; letter-spacing: 3px; color: var(--neon-cyan); text-shadow: 0 0 10px var(--neon-cyan); }
    .item-link {
      display: block; padding: 10px 14px; margin: 8px 0; border-radius: 8px; color: var(--text); text-decoration: none; font-weight: 600;
      background: linear-gradient(90deg, rgba(255,46,151,.25), transparent); border-left: 4px solid var(--neon-pink);
      opacity: 0; animation: slide .5s ease forwards; transition: transform .2s, background .2s, box-shadow .2s;
    }
    .item-link:hover { transform: translateX(10px); background: linear-gradient(90deg, var(--neon-pink), rgba(255,46,151,.2)); box-shadow: 0 0 16px rgba(255,46,151,.7); }
    .item-link::after { content: " →"; opacity: 0; transition: opacity .2s; }
    .item-link:hover::after { opacity: 1; }
    #empty-state { margin-top: 14px; color: var(--muted); display: none; }
    .item-link:nth-child(1) { animation-delay: 0.36s; }
    .item-link:nth-child(2) { animation-delay: 0.42s; }
    .item-link:nth-child(3) { animation-delay: 0.48s; }
    .item-link:nth-child(4) { animation-delay: 0.54s; }
    .item-link:nth-child(5) { animation-delay: 0.60s; }
    .item-link:nth-child(6) { animation-delay: 0.66s; }
    .item-link:nth-child(7) { animation-delay: 0.72s; }
    .item-link:nth-child(8) { animation-delay: 0.78s; }
    .item-link:nth-child(9) { animation-delay: 0.84s; }
    .item-link:nth-child(10) { animation-delay: 0.90s; }
    .item-link:nth-child(11) { animation-delay: 0.96s; }
    .item-link:nth-child(12) { animation-delay: 1.02s; }

    /* ---- glassmorphism: colourful blobs behind frosted panels ---- */
    body::before, body::after {
      content: ""; position: fixed; inset: auto; z-index: -1; pointer-events: none; mask-image: none; clip-path: none;
      width: 46vmax; height: 46vmax; border-radius: 50%; filter: blur(70px); opacity: .6;
      background: none; transform: none; animation: gdrift 20s ease-in-out infinite alternate;
    }
    body::before { background-color: #ff2e97; top: -14vmax; left: -12vmax; }
    body::after { background-color: #19e3ff; bottom: -16vmax; right: -12vmax; animation-duration: 26s; animation-direction: alternate-reverse; }
    @keyframes gdrift { to { transform: translate(12vmax, 8vmax) scale(1.2); } }
    body { background: linear-gradient(160deg, #1a0538, #3b0a64 60%, #5a0f6e) fixed; }
    h1 { text-shadow: 0 0 18px rgba(255,255,255,.35), 0 4px 30px rgba(255,46,151,.6); }
    .section, .item-link, #search, .back-link {
      background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.28); backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%);
      box-shadow: 0 8px 32px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.35);
    }
    .section { border-radius: 22px; }
    .section:nth-child(2) { border-color: rgba(255,255,255,.28); box-shadow: 0 8px 32px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.35); }
    .item-link { border-radius: 14px; border-left: 1px solid rgba(255,255,255,.28); }
    .item-link:hover { background: rgba(255,255,255,.22); box-shadow: 0 10px 30px rgba(255,46,151,.35), inset 0 1px 0 rgba(255,255,255,.5); }
    .back-link { padding: 8px 16px; border-radius: 999px; text-shadow: none; }
    #search { border-radius: 16px; }
    #search:focus { border-color: rgba(255,255,255,.6); box-shadow: 0 0 0 4px rgba(255,255,255,.15); }

    /* ---- unified soft glass palette (weeks 2-6) ---- */
    :root { --acc: #a5b4ff; --txt: #eef1ff; --soft: #aab3d6; --line: rgba(255,255,255,.18); --pane: rgba(255,255,255,.08); }
    body { background: linear-gradient(160deg, #0f1226, #181c3a 60%, #121631) fixed; color: var(--txt); animation: none; }
    body::before, body::after {
      content: ""; position: fixed; z-index: -1; pointer-events: none; mask-image: none; clip-path: none; transform: none;
      left: auto; right: auto; top: auto; bottom: auto; margin: 0; width: 46vmax; height: 46vmax; border-radius: 50%;
      filter: blur(90px); opacity: .28; background: none; animation: gdrift 24s ease-in-out infinite alternate;
    }
    body::before { background-color: #6366f1; top: -14vmax; left: -12vmax; }
    body::after { background-color: #14b8a6; bottom: -16vmax; right: -12vmax; animation-duration: 30s; animation-direction: alternate-reverse; }
    @keyframes gdrift { to { transform: translate(10vmax, 6vmax) scale(1.15); } }
    h1 {
      color: #fff; background: none; border: 0; box-shadow: none; padding: 0; border-radius: 0; transform: none;
      -webkit-text-fill-color: #fff; text-shadow: 0 2px 20px rgba(165,180,255,.35); animation: none;
    }
    h2 { color: var(--acc); background: none; border: 0; box-shadow: none; padding: 0; text-shadow: none; }
    .container, .section, .item-link, #search, .back-link {
      color: var(--txt); background: var(--pane); border: 1px solid var(--line);
      box-shadow: 0 8px 32px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.2);
      backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); text-shadow: none;
    }
    .container { border-radius: 26px; padding: 28px; }
    .section { border-radius: 20px; transform: none; }
    .section:nth-child(1), .section:nth-child(2) { background: var(--pane); border-color: var(--line); transform: none; }
    .item-link { border-radius: 14px; font-weight: 500; }
    .item-link::before { color: var(--acc); }
    .item-link:hover, .item-link:hover::before {
      color: #fff; background: rgba(255,255,255,.16); border-color: var(--acc);
      box-shadow: 0 10px 30px rgba(99,102,241,.35), inset 0 1px 0 rgba(255,255,255,.3);
    }
    .back-link { color: var(--acc); border-radius: 999px; padding: 8px 16px; font-weight: 600; }
    .back-link:hover { color: #fff; border-color: var(--acc); }
    #search { border-radius: 14px; }
    #search::placeholder { color: var(--soft); }
    #search:focus { border-color: var(--acc); box-shadow: 0 0 0 4px rgba(165,180,255,.2); }
    #empty-state { color: var(--soft); }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main class="container">
    <div class="header">
      <h1>Week 2</h1>
      <a class="back-link" href="../index.html">← Back to Main</a>
    </div>

    <input id="search" type="search" placeholder="Filter exercises by title or number" aria-label="Filter links">

    <div class="section-grid">
      <section class="section">
        <h2>week2_1</h2>
        <a class="item-link" href="week2_1/e1.html">Exercise 1</a>
        <a class="item-link" href="week2_1/e2.html">Exercise 2</a>
        <a class="item-link" href="week2_1/e3.html">Exercise 3</a>
        <a class="item-link" href="week2_1/e4.html">Exercise 4</a>
        <a class="item-link" href="week2_1/e5.html">Exercise 5</a>
        <a class="item-link" href="week2_1/e6.html">Exercise 6</a>
        <a class="item-link" href="week2_1/e7.html">Exercise 7</a>
        <a class="item-link" href="week2_1/e8.html">Exercise 8</a>
      </section>

      <section class="section">
        <h2>week2_2</h2>
        <a class="item-link" href="week2_2/ex_1.html">Exercise 1</a>
        <a class="item-link" href="week2_2/ex_2.html">Exercise 2</a>
        <a class="item-link" href="week2_2/ex_3.html">Exercise 3</a>
        <a class="item-link" href="week2_2/ex_4.html">Exercise 4</a>
        <a class="item-link" href="week2_2/ex_5.html">Exercise 5</a>
        <a class="item-link" href="week2_2/ex_6.html">Exercise 6</a>
        <a class="item-link" href="week2_2/ex_7.html">Exercise 7</a>
        <a class="item-link" href="week2_2/ex_8.html">Exercise 8</a>
      </section>
    </div>

    <p id="empty-state">No matching exercises found.</p>
  </main>

  <script>
    const search = document.getElementById("search");
    const links = [...document.querySelectorAll(".item-link")];
    const sections = [...document.querySelectorAll(".section")];
    const emptyState = document.getElementById("empty-state");

    search.addEventListener("input", (event) => {
      const query = event.target.value.trim().toLowerCase();
      let visibleCount = 0;

      links.forEach((link) => {
        const visible = link.textContent.toLowerCase().includes(query) || link.getAttribute("href").toLowerCase().includes(query);
        link.style.display = visible ? "block" : "none";
        if (visible) visibleCount += 1;
      });

      sections.forEach((section) => {
        const hasVisible = [...section.querySelectorAll(".item-link")].some((item) => item.style.display !== "none");
        section.style.display = hasVisible ? "block" : "none";
      });

      emptyState.style.display = visibleCount ? "none" : "block";
    });
  </script>
</body>
</html>
