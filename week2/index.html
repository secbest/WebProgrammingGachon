<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Week 2 - Web Programming</title>
  <link rel="stylesheet" href="../assets/index-glass.css">
</head>
<body>
  <main class="container">
    <div class="header">
      <h1>Week 2</h1>
      <a class="back-link" href="../index.html">← Back to Main</a>
    </div>

    <input id="search" type="search" placeholder="Filter exercises by title or number" aria-label="Filter links">

    <div class="section-grid">
      <section class="section">
        <h2>week2_1</h2>
        <a class="item-link" href="week2_1/e1.html">Exercise 1</a>
        <a class="item-link" href="week2_1/e2.html">Exercise 2</a>
        <a class="item-link" href="week2_1/e3.html">Exercise 3</a>
        <a class="item-link" href="week2_1/e4.html">Exercise 4</a>
        <a class="item-link" href="week2_1/e5.html">Exercise 5</a>
        <a class="item-link" href="week2_1/e6.html">Exercise 6</a>
        <a class="item-link" href="week2_1/e7.html">Exercise 7</a>
        <a class="item-link" href="week2_1/e8.html">Exercise 8</a>
      </section>

      <section class="section">
        <h2>week2_2</h2>
        <a class="item-link" href="week2_2/ex_1.html">Exercise 1</a>
        <a class="item-link" href="week2_2/ex_2.html">Exercise 2</a>
        <a class="item-link" href="week2_2/ex_3.html">Exercise 3</a>
        <a class="item-link" href="week2_2/ex_4.html">Exercise 4</a>
        <a class="item-link" href="week2_2/ex_5.html">Exercise 5</a>
        <a class="item-link" href="week2_2/ex_6.html">Exercise 6</a>
        <a class="item-link" href="week2_2/ex_7.html">Exercise 7</a>
        <a class="item-link" href="week2_2/ex_8.html">Exercise 8</a>
      </section>
    </div>

    <p id="empty-state">No matching exercises found.</p>
  </main>

  <script>
    const search = document.getElementById("search");
    const links = [...document.querySelectorAll(".item-link")];
    const sections = [...document.querySelectorAll(".section")];
    const emptyState = document.getElementById("empty-state");

    search.addEventListener("input", (event) => {
      const query = event.target.value.trim().toLowerCase();
      let visibleCount = 0;

      links.forEach((link) => {
        const visible = link.textContent.toLowerCase().includes(query) || link.getAttribute("href").toLowerCase().includes(query);
        link.style.display = visible ? "block" : "none";
        if (visible) visibleCount += 1;
      });

      sections.forEach((section) => {
        const hasVisible = [...section.querySelectorAll(".item-link")].some((item) => item.style.display !== "none");
        section.style.display = hasVisible ? "block" : "none";
      });

      emptyState.style.display = visibleCount ? "none" : "block";
    });
  </script>
</body>
</html>
