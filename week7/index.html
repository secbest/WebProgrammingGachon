<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Week 7 - Web Programming</title>
  <link rel="stylesheet" href="../assets/index-glass.css">
  <style>
    /* status dot + corner planet (static, no endless animation) */
    .item-link { position: relative; padding-left: 48px; }
    .item-link::before {
      content: ""; position: absolute; left: 20px; top: 50%; width: 10px; height: 10px; margin-top: -5px;
      border-radius: 50%; background: #6ee7ff; box-shadow: 0 0 0 4px rgba(110,231,255,.18);
    }
    .container::after {
      content: ""; position: absolute; top: 22px; right: 26px; width: 20px; height: 20px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fff, #a78bfa); box-shadow: 0 0 14px #a78bfa;
    }
    .header { padding-right: 40px; }
  </style>
</head>
<body>
  <main class="container">
    <div class="header">
      <h1>Week 7</h1>
      <a class="back-link" href="../index.html">← Back to Main</a>
    </div>

    <input id="search" type="search" placeholder="Filter exercises by title" aria-label="Filter links">

    <nav class="link-list" aria-label="Week 7 exercises">
      <a class="item-link" href="book_search.html">Lab - Book Search App (Open Library API)</a>
    </nav>

    <p id="empty-state">No matching exercises found.</p>
  </main>

  <script>
    const search = document.getElementById("search");
    const links = [...document.querySelectorAll(".item-link")];
    const emptyState = document.getElementById("empty-state");

    search.addEventListener("input", (event) => {
      const query = event.target.value.trim().toLowerCase();
      let visibleCount = 0;

      links.forEach((link) => {
        const visible = link.textContent.toLowerCase().includes(query) || link.getAttribute("href").toLowerCase().includes(query);
        link.style.display = visible ? "block" : "none";
        if (visible) visibleCount += 1;
      });

      emptyState.style.display = visibleCount ? "none" : "block";
    });
  </script>
</body>
</html>
