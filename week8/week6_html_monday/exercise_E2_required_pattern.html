<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Week 6 - E2 Required &amp; Pattern Attributes</title>
    <style>
        body { font-family: system-ui; padding: 24px; max-width: 420px; margin: 0 auto; }
        label { font-size: 13px; font-weight: 600; display: block; margin-bottom: 4px; margin-top: 14px; }
        input { width: 100%; padding: 9px 12px; border: 2px solid #c8d4f0;
            border-radius: 8px; font-size: 14px; }
        input:focus { border-color: #1a56db; outline: none; }
        button { margin-top: 16px; background: #1a56db; color: white;
            border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 700; }
        #message { margin-top: 14px; font-weight: 600; color: #16a34a; min-height: 1.4em; }
        .back { display: inline-block; margin-bottom: 16px; color: #1a56db; text-decoration: none; font-size: 14px; }
    </style>
</head>

<body>
    <a class="back" href="../index.html">← Week 8</a>
    <h2>Gachon Registration</h2>

    <form id="register-form" method="post" action="/register">

        <label for="sid">Student ID</label>
        <input type="text" id="sid" name="student_id"
               pattern="\d{9}" required
               title="Enter your 9-digit student ID"
               placeholder="202112345">

        <label for="r-email">Email</label>
        <input type="email" id="r-email" name="email"
               required
               placeholder="name@gachon.ac.kr">

        <label for="r-pw">Password</label>
        <input type="password" id="r-pw" name="password"
               minlength="8" required
               placeholder="At least 8 characters">

        <label for="r-age">Age</label>
        <input type="number" id="r-age" name="age"
               min="16" max="100" required
               placeholder="Your age">

        <button type="submit">Register</button>
    </form>
    <p id="message" aria-live="polite"></p>

    <script>
        // No server on a static site: show a message instead of posting.
        // Browser validation (pattern, required, minlength, min/max) runs before this fires.
        document.getElementById('register-form').addEventListener('submit', (e) => {
            e.preventDefault();
            document.getElementById('message').textContent = '✅ All fields are valid — it would be posted to /register.';
        });
    </script>
</body>

</html>
