<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Week 6 Homework - Student Registration Form</title>
    <style>
        :root {
            --blue: #1a56db;
            --green: #16a34a;
            --red: #dc2626;
            --border: #c8d4f0;
            --bg: #eef3ff;
            --text: #1b2640;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 24px 16px 48px;
            font-family: system-ui, "Segoe UI", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .card {
            max-width: 560px;
            margin: 0 auto;
            padding: 28px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(26, 86, 219, .1);
        }

        .back { display: inline-block; margin-bottom: 12px; color: var(--blue); text-decoration: none; font-size: 14px; }
        h1 { margin: 0 0 4px; font-size: 1.6rem; }
        .sub { margin: 0 0 20px; color: #5f6b8a; font-size: .95rem; }

        fieldset {
            margin: 0 0 20px;
            padding: 8px 18px 18px;
            border: 2px solid var(--border);
            border-radius: 12px;
        }

        legend { padding: 0 8px; font-weight: 700; color: var(--blue); }

        label { display: block; margin: 14px 0 4px; font-size: 13px; font-weight: 600; }
        .req::after { content: " *"; color: var(--red); }
        .hint { margin: 4px 0 0; font-size: 12px; color: #6b7a99; }

        input[type="text"], input[type="email"], input[type="password"],
        input[type="date"], select {
            width: 100%;
            padding: 10px 14px;
            font-size: 14px;
            font-family: inherit;
            background: #fff;
            border: 2px solid var(--border);
            border-radius: 8px;
            outline: none;
            transition: border-color .2s, background .2s, box-shadow .2s;
        }

        /* ---- Validation states ---- */
        input:focus, select:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(26, 86, 219, .15);
        }

        /* Only style once the user has typed something */
        input:not([type="date"]):valid:not(:placeholder-shown) {
            border-color: var(--green);
            background: #f0fdf4;
        }

        input:not([type="date"]):invalid:not(:placeholder-shown) {
            border-color: var(--red);
            background: #fef2f2;
        }

        /* Date inputs have no placeholder, so use :user-valid / :user-invalid (only after the user interacts) */
        input[type="date"]:user-valid { border-color: var(--green); background: #f0fdf4; }
        input[type="date"]:user-invalid { border-color: var(--red); background: #fef2f2; }

        .checkbox-row { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
        .checkbox-row input { width: 18px; height: 18px; }
        .checkbox-row label { margin: 0; font-weight: 500; }

        /* Bonus: range slider */
        .range-row { display: flex; align-items: center; gap: 14px; }
        .range-row input { flex: 1; accent-color: var(--blue); }
        output {
            min-width: 64px;
            padding: 4px 10px;
            text-align: center;
            font-weight: 700;
            color: var(--blue);
            background: #e8efff;
            border-radius: 999px;
        }

        button[type="submit"] {
            width: 100%;
            padding: 13px;
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            background: var(--blue);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background .2s, transform .15s;
        }

        button[type="submit"]:hover { background: #1444b0; transform: translateY(-1px); }

        #message { margin: 16px 0 0; font-weight: 600; color: var(--green); min-height: 1.4em; }
    </style>
</head>

<body>
    <main class="card">
        <a class="back" href="../index.html">← Week 8</a>
        <h1>🎓 Student Registration</h1>
        <p class="sub">Fields marked <span style="color:var(--red)">*</span> are required.</p>

        <form id="registration-form" method="post" action="/register">

            <fieldset>
                <legend>Personal Info</legend>

                <label for="fullname" class="req">Full Name</label>
                <input type="text" id="fullname" name="full_name" required placeholder="Kim Jisoo">

                <label for="sid" class="req">Student ID</label>
                <input type="text" id="sid" name="student_id" required pattern="\d{9}"
                       title="Enter your 9-digit student ID" placeholder="202112345">
                <p class="hint">9 digits, e.g. 202112345</p>

                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob">

                <label for="major">Major</label>
                <select id="major" name="major">
                    <option value="">-- Select your major --</option>
                    <option value="cs">Computer Science</option>
                    <option value="se">Software Engineering</option>
                    <option value="ai">Artificial Intelligence</option>
                    <option value="ds">Data Science</option>
                    <option value="ee">Electrical Engineering</option>
                    <option value="bus">Business Administration</option>
                </select>
            </fieldset>

            <fieldset>
                <legend>Account Info</legend>

                <label for="email" class="req">Email</label>
                <input type="email" id="email" name="email" required placeholder="name@gachon.ac.kr">

                <label for="password" class="req">Password</label>
                <input type="password" id="password" name="password" required minlength="8"
                       placeholder="At least 8 characters">

                <label for="phone">Phone</label>
                <input type="text" id="phone" name="phone" pattern="\d{3}-\d{4}-\d{4}"
                       title="Format: 010-1234-5678" placeholder="010-1234-5678">
                <p class="hint">Format: 010-1234-5678</p>

                <label for="experience">Years of coding experience</label>
                <div class="range-row">
                    <input type="range" id="experience" name="experience" min="0" max="10" value="0">
                    <output id="experience-value" for="experience">0 years</output>
                </div>
            </fieldset>

            <div class="checkbox-row">
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms" class="req">I agree to the terms</label>
            </div>
            <br>

            <button type="submit">Register</button>
        </form>

        <p id="message" aria-live="polite"></p>
    </main>

    <script>
        // Bonus: live display of the slider value
        const slider = document.getElementById('experience');
        const sliderValue = document.getElementById('experience-value');

        function updateExperience() {
            const years = Number(slider.value);
            sliderValue.textContent = years + (years === 1 ? ' year' : ' years');
        }
        slider.addEventListener('input', updateExperience);
        updateExperience();

        // No server on a static site: show a message instead of posting.
        // The browser's own validation runs first, so this only fires when everything is valid.
        document.getElementById('registration-form').addEventListener('submit', (e) => {
            e.preventDefault();
            document.getElementById('message').textContent =
                '✅ Registration is valid — it would be posted to /register.';
        });
    </script>
</body>

</html>
