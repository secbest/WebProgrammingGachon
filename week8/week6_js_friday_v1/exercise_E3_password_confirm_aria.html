<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Week 6 Friday v1 - E3 Password Confirmation with ARIA</title>
    <style>
        body { font-family: system-ui; padding: 28px; max-width: 400px; margin: 0 auto; }
        label { font-size: 13px; font-weight: 600; display: block; margin-bottom: 4px; margin-top: 16px; }
        input {
            width: 100%; padding: 10px 14px; border: 2px solid #c8d4f0;
            border-radius: 8px; font-size: 14px; outline: none; transition: all .2s;
        }
        input:focus { border-color: #1a56db; }
        input.ok  { border-color: #16a34a; }
        input.err { border-color: #dc2626; }
        .err-span { font-size: 12px; font-weight: 600; color: #dc2626; min-height: 18px; display: block; margin-top: 4px; }
        .err-span.good { color: #16a34a; }
        button { margin-top: 18px; background: #1a56db; color: #fff; border: none;
            padding: 11px 24px; border-radius: 8px; cursor: pointer; font-weight: 700; }
        #result { margin-top: 14px; font-weight: 700; color: #16a34a; min-height: 1.4em; }
        .back { display: inline-block; margin-bottom: 16px; color: #1a56db; text-decoration: none; font-size: 14px; }
    </style>
</head>

<body>
    <a class="back" href="../index.html">← Week 8</a>
    <h2>Create Account</h2>
    <form id="pw-form" novalidate>
        <label for="pw">Password</label>
        <input type="password" id="pw" required minlength="8"
               aria-describedby="pw-err" aria-required="true" aria-invalid="false"
               placeholder="At least 8 characters">
        <span id="pw-err" class="err-span" aria-live="polite"></span>

        <label for="cfm">Confirm Password</label>
        <input type="password" id="cfm" required
               aria-describedby="cfm-err" aria-required="true" aria-invalid="false"
               placeholder="Repeat your password">
        <span id="cfm-err" class="err-span" aria-live="polite"></span>

        <button type="submit">Create Account</button>
    </form>
    <p id="result" aria-live="polite"></p>

    <script>
        const pw = document.querySelector('#pw');
        const cfm = document.querySelector('#cfm');
        const pwErr = document.querySelector('#pw-err');
        const cfmErr = document.querySelector('#cfm-err');
        const form = document.querySelector('#pw-form');
        const result = document.querySelector('#result');

        // Shared helper: update class, aria-invalid and the message for one field
        function setState(input, errEl, message, good = false) {
            const invalid = message !== '' && !good;
            input.classList.toggle('err', invalid);
            input.classList.toggle('ok', !invalid && input.value !== '');
            input.setAttribute('aria-invalid', invalid ? 'true' : 'false');
            errEl.textContent = message;
            errEl.classList.toggle('good', good);
        }

        // 1. Password: at least 8 characters
        function checkPw() {
            if (pw.value === '') setState(pw, pwErr, 'Password is required.');
            else if (pw.value.length < 8) setState(pw, pwErr, 'Password must be at least 8 characters.');
            else setState(pw, pwErr, '');
        }

        // 2. Confirm: must match the password exactly (setCustomValidity)
        function checkCfm() {
            if (cfm.value === '') {
                cfm.setCustomValidity('Please confirm your password.');
                setState(cfm, cfmErr, '');
            } else if (cfm.value !== pw.value) {
                cfm.setCustomValidity('Passwords do not match.');
                setState(cfm, cfmErr, 'Passwords do not match.');
            } else {
                cfm.setCustomValidity('');          // must be cleared, or the field stays invalid
                setState(cfm, cfmErr, '✓ Passwords match', true);
            }
        }

        // 3 & 4. Live validation; changing the password re-checks the confirm field
        pw.addEventListener('input', () => {
            checkPw();
            if (cfm.value !== '') checkCfm();
        });
        cfm.addEventListener('input', checkCfm);

        // 5. Submit
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            checkPw();
            checkCfm();
            if (pw.value.length >= 8 && cfm.validity.valid) {
                console.log('submitted');
                result.textContent = '✅ Account created!';
            } else {
                result.textContent = '';
                (pw.value.length < 8 ? pw : cfm).focus();
            }
        });
    </script>
</body>

</html>
