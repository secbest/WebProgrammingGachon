<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Week 6 Friday Homework - Registration Form with JS Validation</title>
    <style>
        :root {
            --blue: #1a56db;
            --green: #16a34a;
            --red: #dc2626;
            --border: #c8d4f0;
            --bg: #eef3ff;
            --text: #1b2640;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 24px 16px 48px;
            font-family: system-ui, "Segoe UI", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .card {
            max-width: 560px;
            margin: 0 auto;
            padding: 28px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(26, 86, 219, .1);
        }

        .back { display: inline-block; margin-bottom: 12px; color: var(--blue); text-decoration: none; font-size: 14px; }
        h1 { margin: 0 0 4px; font-size: 1.6rem; }
        .sub { margin: 0 0 20px; color: #5f6b8a; font-size: .95rem; }

        fieldset { margin: 0 0 20px; padding: 8px 18px 18px; border: 2px solid var(--border); border-radius: 12px; }
        legend { padding: 0 8px; font-weight: 700; color: var(--blue); }

        label { display: block; margin: 14px 0 4px; font-size: 13px; font-weight: 600; }
        .req::after { content: " *"; color: var(--red); }

        input[type="text"], input[type="email"], input[type="password"],
        input[type="date"], select {
            width: 100%;
            padding: 10px 14px;
            font-size: 14px;
            font-family: inherit;
            background: #fff;
            border: 2px solid var(--border);
            border-radius: 8px;
            outline: none;
            transition: border-color .2s, background .2s, box-shadow .2s;
        }

        input:focus, select:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(26, 86, 219, .15); }

        /* Classes toggled by JavaScript */
        .is-valid { border-color: var(--green) !important; background: #f0fdf4 !important; }
        .is-invalid { border-color: var(--red) !important; background: #fef2f2 !important; }

        .error {
            display: block;
            min-height: 18px;
            margin-top: 4px;
            font-size: 12px;
            font-weight: 600;
            color: var(--red);
        }

        .error.good { color: var(--green); }

        .checkbox-row { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
        .checkbox-row input { width: 18px; height: 18px; }
        .checkbox-row label { margin: 0; font-weight: 500; }

        .range-row { display: flex; align-items: center; gap: 14px; }
        .range-row input { flex: 1; accent-color: var(--blue); }
        output {
            min-width: 64px; padding: 4px 10px; text-align: center; font-weight: 700;
            color: var(--blue); background: #e8efff; border-radius: 999px;
        }

        button[type="submit"] {
            width: 100%;
            padding: 13px;
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            background: var(--blue);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background .2s, opacity .2s, transform .15s;
        }

        button[type="submit"]:hover:not(:disabled) { background: #1444b0; transform: translateY(-1px); }
        button[type="submit"]:disabled { opacity: .45; cursor: not-allowed; }

        .hint { margin: 8px 0 0; font-size: 12px; color: #6b7a99; text-align: center; }

        /* Success panel */
        .success {
            display: none;
            padding: 28px 20px;
            text-align: center;
            background: linear-gradient(135deg, #ecfdf3, #dcfce7);
            border: 2px solid var(--green);
            border-radius: 14px;
            animation: pop .5s cubic-bezier(.2, 1.2, .3, 1);
        }

        .success.show { display: block; }
        .success h2 { margin: 0 0 6px; color: #166534; }
        .success p { margin: 0 0 16px; color: #166534; }
        .success button {
            padding: 10px 20px; font-weight: 700; color: #166534; background: #fff;
            border: 2px solid var(--green); border-radius: 8px; cursor: pointer;
        }

        @keyframes pop { from { opacity: 0; transform: scale(.9); } }
    </style>
</head>

<body>
    <main class="card">
        <a class="back" href="../index.html">← Week 8</a>
        <h1>🎓 Student Registration</h1>
        <p class="sub">Fields marked <span style="color:var(--red)">*</span> are required.</p>

        <!-- novalidate: turn off the browser's own popups; JavaScript does the validating -->
        <form id="registration-form" method="post" action="/register" novalidate>

            <fieldset>
                <legend>Personal Info</legend>

                <label for="fullname" class="req">Full Name</label>
                <input type="text" id="fullname" name="full_name" required
                       aria-required="true" aria-invalid="false" aria-describedby="fullname-err"
                       placeholder="Kim Jisoo" autocomplete="name">
                <span class="error" id="fullname-err" aria-live="polite"></span>

                <label for="sid" class="req">Student ID</label>
                <input type="text" id="sid" name="student_id" required inputmode="numeric"
                       aria-required="true" aria-invalid="false" aria-describedby="sid-err"
                       placeholder="202112345">
                <span class="error" id="sid-err" aria-live="polite"></span>

                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob"
                       aria-invalid="false" aria-describedby="dob-err">
                <span class="error" id="dob-err" aria-live="polite"></span>

                <label for="major">Major</label>
                <select id="major" name="major" aria-invalid="false" aria-describedby="major-err">
                    <option value="">-- Select your major --</option>
                    <option value="cs">Computer Science</option>
                    <option value="se">Software Engineering</option>
                    <option value="ai">Artificial Intelligence</option>
                    <option value="ds">Data Science</option>
                    <option value="ee">Electrical Engineering</option>
                    <option value="bus">Business Administration</option>
                </select>
                <span class="error" id="major-err" aria-live="polite"></span>
            </fieldset>

            <fieldset>
                <legend>Account Info</legend>

                <label for="email" class="req">Email</label>
                <input type="email" id="email" name="email" required autocomplete="email"
                       aria-required="true" aria-invalid="false" aria-describedby="email-err"
                       placeholder="name@gachon.ac.kr">
                <span class="error" id="email-err" aria-live="polite"></span>

                <label for="password" class="req">Password</label>
                <input type="password" id="password" name="password" required minlength="8"
                       autocomplete="new-password"
                       aria-required="true" aria-invalid="false" aria-describedby="password-err"
                       placeholder="At least 8 characters">
                <span class="error" id="password-err" aria-live="polite"></span>

                <label for="confirm" class="req">Confirm Password</label>
                <input type="password" id="confirm" name="confirm" required autocomplete="new-password"
                       aria-required="true" aria-invalid="false" aria-describedby="confirm-err"
                       placeholder="Repeat your password">
                <span class="error" id="confirm-err" aria-live="polite"></span>

                <label for="phone">Phone</label>
                <input type="text" id="phone" name="phone" inputmode="tel"
                       aria-invalid="false" aria-describedby="phone-err"
                       placeholder="010-1234-5678">
                <span class="error" id="phone-err" aria-live="polite"></span>

                <label for="experience">Years of coding experience</label>
                <div class="range-row">
                    <input type="range" id="experience" name="experience" min="0" max="10" value="0" aria-describedby="experience-value">
                    <output id="experience-value" for="experience">0 years</output>
                </div>
            </fieldset>

            <div class="checkbox-row">
                <input type="checkbox" id="terms" name="terms" required
                       aria-required="true" aria-invalid="false" aria-describedby="terms-err">
                <label for="terms" class="req">I agree to the terms</label>
            </div>
            <span class="error" id="terms-err" aria-live="polite"></span>

            <button type="submit" id="submit-btn" disabled>Register</button>
            <p class="hint" id="submit-hint">Complete all required fields to enable Register.</p>
        </form>

        <section class="success" id="success" role="status" aria-live="polite">
            <h2>🎉 Registration successful!</h2>
            <p id="success-text"></p>
            <button type="button" id="reset-btn">Register another student</button>
        </section>
    </main>

    <script>
        const form = document.getElementById('registration-form');
        const submitBtn = document.getElementById('submit-btn');
        const submitHint = document.getElementById('submit-hint');
        const successBox = document.getElementById('success');

        const SID_PATTERN = /^\d{9}$/;
        const PHONE_PATTERN = /^\d{3}-\d{4}-\d{4}$/;

        // One entry per validated field. check() returns an error message, '' when valid,
        // or { ok: '...' } for a positive message. Reading input.validity keeps it close to the HTML5 API.
        const fields = [
            {
                id: 'fullname',
                check: (el) => (el.validity.valueMissing || el.value.trim() === '') ? 'Full name is required.' : ''
            },
            {
                id: 'sid',
                check: (el) => {
                    if (el.validity.valueMissing) return 'Student ID is required.';
                    if (!SID_PATTERN.test(el.value)) return 'Student ID must be exactly 9 digits.';
                    return '';
                }
            },
            {
                id: 'dob',
                optional: true,
                check: (el) => {
                    if (el.value && new Date(el.value) > new Date()) return 'Date of birth cannot be in the future.';
                    return '';
                }
            },
            {
                id: 'major',
                optional: true,
                check: () => ''
            },
            {
                id: 'email',
                check: (el) => {
                    if (el.validity.valueMissing) return 'Email is required.';
                    if (el.validity.typeMismatch) return 'Please enter a valid email address.';
                    return '';
                }
            },
            {
                id: 'password',
                check: (el) => {
                    if (el.validity.valueMissing) return 'Password is required.';
                    if (el.validity.tooShort || el.value.length < el.minLength) return 'Password must be at least 8 characters.';
                    return '';
                }
            },
            {
                id: 'confirm',
                check: (el) => {
                    const pw = document.getElementById('password').value;
                    if (el.value === '') return 'Please confirm your password.';
                    if (el.value !== pw) return 'Passwords do not match.';
                    return { ok: '✓ Passwords match' };
                }
            },
            {
                id: 'phone',
                optional: true,
                check: (el) => (el.value !== '' && !PHONE_PATTERN.test(el.value)) ? 'Format: 010-1234-5678' : ''
            },
            {
                id: 'terms',
                check: (el) => el.checked ? '' : 'You must agree to the terms.'
            }
        ];

        const touched = new Set();   // errors only show once the user has interacted with a field

        // Run one field's check, keep the browser's validity state in sync, and (optionally) show the result
        function validateField(field, show) {
            const el = document.getElementById(field.id);
            const err = document.getElementById(field.id + '-err');
            const result = field.check(el);
            const message = typeof result === 'object' ? '' : result;
            const okMessage = typeof result === 'object' ? result.ok : '';

            // setCustomValidity makes form.checkValidity() reflect our JS rules too
            el.setCustomValidity(message);

            if (show) {
                const hasValue = el.type === 'checkbox' ? el.checked : el.value !== '';
                const invalid = message !== '';
                el.classList.toggle('is-invalid', invalid);
                el.classList.toggle('is-valid', !invalid && hasValue);
                el.setAttribute('aria-invalid', invalid ? 'true' : 'false');
                err.textContent = message || okMessage;
                err.classList.toggle('good', okMessage !== '');
            }
            return message === '';
        }

        // Bonus: the Register button stays disabled until every field is valid
        function updateSubmitState() {
            fields.forEach((f) => validateField(f, touched.has(f.id)));
            const allValid = form.checkValidity();
            submitBtn.disabled = !allValid;
            submitHint.style.visibility = allValid ? 'hidden' : 'visible';
        }

        // Real-time validation on every field
        fields.forEach((field) => {
            const el = document.getElementById(field.id);
            const handler = () => {
                touched.add(field.id);
                // Changing the password also affects the confirm field
                if (field.id === 'password' && document.getElementById('confirm').value !== '') touched.add('confirm');
                updateSubmitState();
            };
            el.addEventListener(el.type === 'checkbox' ? 'change' : 'input', handler);
            el.addEventListener('blur', handler);
        });

        // Slider: live display of the current value
        const slider = document.getElementById('experience');
        const sliderValue = document.getElementById('experience-value');
        function updateExperience() {
            const years = Number(slider.value);
            sliderValue.textContent = years + (years === 1 ? ' year' : ' years');
        }
        slider.addEventListener('input', updateExperience);
        updateExperience();

        // Intercept submit
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            fields.forEach((f) => touched.add(f.id));
            updateSubmitState();

            if (!form.checkValidity()) {
                const firstBad = form.querySelector('[aria-invalid="true"]');
                if (firstBad) firstBad.focus();
                return;
            }

            const name = document.getElementById('fullname').value.trim();
            document.getElementById('success-text').textContent =
                'Welcome, ' + name + '! Your account has been created.';
            form.style.display = 'none';
            successBox.classList.add('show');
        });

        document.getElementById('reset-btn').addEventListener('click', () => {
            form.reset();
            touched.clear();
            form.querySelectorAll('.is-valid, .is-invalid').forEach((el) => el.classList.remove('is-valid', 'is-invalid'));
            form.querySelectorAll('.error').forEach((el) => { el.textContent = ''; el.classList.remove('good'); });
            updateExperience();
            updateSubmitState();
            successBox.classList.remove('show');
            form.style.display = '';
        });

        updateSubmitState();
    </script>
</body>

</html>
