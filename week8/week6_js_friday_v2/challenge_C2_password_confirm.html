<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Week 6 Friday v2 - C2 Password + Confirm with setCustomValidity()</title>
    <style>
        body { font-family: system-ui; padding: 28px; max-width: 400px; margin: 0 auto; }
        .field-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 16px; }
        label { font-size: 13px; font-weight: 600; }
        input {
            padding: 10px 14px; border: 2px solid #c8d4f0; border-radius: 8px;
            font-size: 14px; outline: none; transition: border-color .2s;
        }
        input:focus { box-shadow: 0 0 0 3px rgba(26, 86, 219, .15); }
        input[aria-invalid="true"] { border-color: #ef4444; }
        [role="alert"] { font-size: 12px; font-weight: 600; color: #ef4444; min-height: 16px; }
        [role="alert"].ok { color: #16a34a; }
        .back { display: inline-block; margin-bottom: 16px; color: #1a56db; text-decoration: none; font-size: 14px; }
    </style>
</head>

<body>
    <a class="back" href="../index.html">← Week 8</a>
    <h2>Set Your Password</h2>

    <form novalidate>
        <div class="field-group">
            <label for="pw">Password</label>
            <input type="password" id="pw" minlength="8" required
                   aria-describedby="pw-err" aria-invalid="false" />
            <span id="pw-err" role="alert"></span>
        </div>

        <div class="field-group">
            <label for="confirm">Confirm Password</label>
            <input type="password" id="confirm" required
                   aria-describedby="confirm-err" aria-invalid="false" />
            <span id="confirm-err" role="alert"></span>
        </div>
    </form>

    <script>
        const pw = document.getElementById('pw');
        const confirm = document.getElementById('confirm');   // note: shadows window.confirm on this page

        function validatePw() {
            const err = document.getElementById('pw-err');
            if (pw.validity.valueMissing) { err.textContent = 'Required.'; pw.setAttribute('aria-invalid', 'true'); }
            else if (pw.validity.tooShort) { err.textContent = 'Min. 8 chars.'; pw.setAttribute('aria-invalid', 'true'); }
            else { err.textContent = ''; pw.setAttribute('aria-invalid', 'false'); }
        }

        function validateConfirm() {
            const err = document.getElementById('confirm-err');
            err.classList.remove('ok');
            if (confirm.value === '') {
                confirm.setCustomValidity('');
                err.textContent = '';
                confirm.setAttribute('aria-invalid', 'false');
            } else if (confirm.value !== pw.value) {
                confirm.setCustomValidity('Passwords do not match');
                err.textContent = 'Passwords do not match.';
                confirm.setAttribute('aria-invalid', 'true');
            } else {
                confirm.setCustomValidity('');   // <- must clear!
                err.textContent = '✓ Passwords match';
                err.classList.add('ok');
                confirm.setAttribute('aria-invalid', 'false');
            }
        }

        // Re-validate confirm whenever the password changes
        pw.addEventListener('input', () => { validatePw(); validateConfirm(); });
        confirm.addEventListener('input', validateConfirm);
    </script>
</body>

</html>
