<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>webpro-w9 · Week 9 Homework</title>
  <style>
    :root { --git: #f05032; --ink: #1a2340; --muted: #5a6a8a; --bg: #f0f4ff; --card: #ffffff; --line: #c8d4f0; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: system-ui, "Segoe UI", Arial, sans-serif; color: var(--ink); background: var(--bg);
    }
    main {
      width: min(560px, 100%); padding: 36px 32px; text-align: center;
      background: var(--card); border: 1px solid var(--line); border-radius: 20px;
      box-shadow: 0 12px 36px rgba(26, 86, 219, .12);
    }
    .badge {
      display: inline-block; margin-bottom: 14px; padding: 4px 12px; border-radius: 6px;
      font-weight: 700; letter-spacing: .03em; color: #fff; background: var(--git);
    }
    h1 { margin: 0 0 6px; font-size: 1.9rem; }
    .name { margin: 18px 0 4px; font-size: 1.35rem; font-weight: 700; }
    .date { margin: 0 0 20px; color: var(--muted); }
    .meta { margin: 0; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: .9rem; }
    code { padding: 1px 6px; border-radius: 4px; background: #e8eefa; }
  </style>
</head>

<body>
  <main>
    <span class="badge">Git</span>
    <h1>Hello, Git &amp; GitHub!</h1>
    <p class="name">Jasper Teo Kheng Cher</p>
    <p class="date">Wednesday, November 4, 2026</p>
    <p class="meta">K0126002 · Web Programming · Gachon University<br>
      Week 9 homework · repository <code>webpro-w9</code></p>
  </main>
</body>

</html>
