<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found · webpro-w9</title>
  <style>
    :root { --ink: #1a2340; --muted: #4a5878; --bg: #f0f4ff; --card: #fff; --line: #c8d4f0; --ac: #1a56db; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: system-ui, "Segoe UI", Arial, sans-serif; color: var(--ink); background: var(--bg);
    }
    main {
      width: min(520px, 100%); padding: 40px 32px; text-align: center;
      background: var(--card); border: 1px solid var(--line); border-radius: 20px;
      box-shadow: 0 12px 36px rgba(26, 86, 219, .12);
    }
    .code { margin: 0; font-size: 4.5rem; font-weight: 800; line-height: 1; color: var(--ac); }
    h1 { margin: 12px 0 8px; font-size: 1.6rem; }
    p { margin: 0 0 22px; color: var(--muted); }
    a.home {
      display: inline-block; padding: 10px 20px; border-radius: 10px; font-weight: 700;
      color: #fff; background: var(--ac); text-decoration: none;
    }
    a.home:hover { background: #1240b0; }
    a.home:focus-visible { outline: 3px solid #f59e0b; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>Oops! Page not found</h1>
    <p>That page doesn't exist. It may have been moved, or the link may be wrong.</p>
    <!-- Absolute path on purpose: a 404 page is served at whatever missing URL was requested,
         so a relative "./" would point to the wrong folder for deep paths like /webpro-w9/a/b -->
    <a class="home" href="/webpro-w9/">← Back to Home</a>
  </main>
</body>
</html>
