<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Book Search</title>
    <style>
        :root {
            --navy: #1b2640;
            --blue: #1a56db;
            --blue-dark: #1444b0;
            --bg: #eef3ff;
            --card: #ffffff;
            --border: #cfd9f3;
            --text: #1b2640;
            --muted: #5f6b8a;
            --radius: 14px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Segoe UI", system-ui, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        /* ---------- Header ---------- */
        header {
            background: var(--navy);
            color: #fff;
            text-align: center;
            padding: 28px 16px;
        }

        header h1 { margin: 0 0 6px; font-size: 2rem; }
        header p { margin: 0; color: #aab6d6; }

        .back-link {
            display: inline-block;
            margin-bottom: 12px;
            color: #aab6d6;
            font-size: .9rem;
            text-decoration: none;
        }

        .back-link:hover { color: #fff; }

        /* ---------- Search bar (Flexbox) ---------- */
        main { max-width: 1000px; margin: 0 auto; padding: 24px 16px 48px; }

        .search-form { display: flex; gap: 12px; margin-bottom: 20px; }

        .search-form input {
            flex: 1;
            min-width: 0;
            padding: 14px 16px;
            font-size: 1rem;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            background: #fff;
            color: var(--text);
            transition: border-color .2s, box-shadow .2s;
        }

        .search-form input:focus {
            outline: none;
            border-color: var(--blue);
            box-shadow: 0 0 0 4px rgba(26, 86, 219, .15);
        }

        .search-form button {
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            background: var(--blue);
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            transition: background .2s, transform .15s;
        }

        .search-form button:hover:not(:disabled) { background: var(--blue-dark); transform: translateY(-1px); }
        .search-form button:disabled { opacity: .6; cursor: wait; }

        .retry-btn {
            grid-column: 1 / -1; justify-self: start; padding: 12px 22px; font-size: 1rem; font-weight: 700;
            color: #fff; background: var(--blue); border: none; border-radius: var(--radius); cursor: pointer;
        }

        .status { margin: 0 0 16px; color: var(--muted); min-height: 1.4em; }
        .status.error { color: #b42318; font-weight: 600; }

        /* ---------- Results (Grid) ---------- */
        .results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .book-card {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            color: inherit;
            text-decoration: none;
            animation: fade-up .45s ease both;
            transition: transform .2s, box-shadow .2s, border-color .2s;
        }

        .book-card:hover {
            transform: translateY(-6px);
            border-color: var(--blue);
            box-shadow: 0 14px 30px rgba(26, 86, 219, .18);
        }

        .cover {
            width: 100%;
            aspect-ratio: 2 / 3;
            object-fit: cover;
            background: #dfe6f7;
            display: block;
        }

        .no-cover {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            aspect-ratio: 2 / 3;
            background: linear-gradient(160deg, #dfe6f7, #c7d3f9);
        }

        .book-info { padding: 14px; }
        .book-title { margin: 0 0 6px; font-size: 1rem; line-height: 1.3; }
        .book-meta { margin: 0; font-size: .875rem; color: var(--muted); }

        /* ---------- Skeleton loading cards ---------- */
        .skeleton { pointer-events: none; }

        .skeleton .cover-skel,
        .skeleton .line {
            background: linear-gradient(90deg, #e3e9f8 25%, #f1f4fc 50%, #e3e9f8 75%);
            background-size: 200% 100%;
            animation: shimmer 1.2s linear infinite;
        }

        .skeleton .cover-skel { aspect-ratio: 2 / 3; }
        .skeleton .line { height: 12px; border-radius: 6px; margin: 8px 0; }
        .skeleton .line.short { width: 60%; }

        @keyframes shimmer { to { background-position: -200% 0; } }
        @keyframes fade-up { from { opacity: 0; transform: translateY(16px); } }

        @media (max-width: 520px) {
            .search-form { flex-direction: column; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
</head>

<body>
    <header>
        <a class="back-link" href="index.html">← Week 7</a>
        <h1>📚 Book Search</h1>
        <p>Search the Open Library — millions of books, free</p>
    </header>

    <main>
        <form id="search-form" class="search-form" role="search">
            <input id="query" type="search" placeholder="Search by book title, e.g. harry potter"
                aria-label="Book title" autocomplete="off" required>
            <button id="search-btn" type="submit">Search</button>
        </form>

        <p id="status" class="status" aria-live="polite"></p>
        <section id="results" class="results" aria-label="Search results"></section>
    </main>

    <script>
        const API_URL = 'https://openlibrary.org/search.json';
        const COVER_URL = 'https://covers.openlibrary.org/b/id/';
        const LIMIT = 12;
        const TIMEOUT_MS = 10000;
        const CACHE_KEY = 'bookSearchCache';

        const form = document.getElementById('search-form');
        const input = document.getElementById('query');
        const button = document.getElementById('search-btn');
        const statusEl = document.getElementById('status');
        const resultsEl = document.getElementById('results');

        // Step 3: wire the form
        form.addEventListener('submit', (event) => {
            event.preventDefault();
            const query = input.value.trim();
            if (query) searchBooks(query);
        });

        function setStatus(message, isError = false) {
            statusEl.textContent = message;
            statusEl.classList.toggle('error', isError);
        }

        // Step 6: skeleton cards while loading
        function showSkeletons() {
            resultsEl.replaceChildren();
            for (let i = 0; i < LIMIT; i++) {
                const card = document.createElement('div');
                card.className = 'book-card skeleton';
                card.innerHTML = '<div class="cover-skel"></div>' +
                    '<div class="book-info"><div class="line"></div><div class="line short"></div></div>';
                resultsEl.appendChild(card);
            }
        }

        // Step 4: fetch -> check res.ok -> parse JSON (with a timeout so the page never hangs)
        async function fetchBooks(query) {
            const url = API_URL + '?q=' + encodeURIComponent(query) + '&limit=' + LIMIT +
                '&fields=key,title,author_name,first_publish_year,cover_i,cover_edition_key';
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);
            try {
                const res = await fetch(url, { signal: controller.signal });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return await res.json();
            } finally {
                clearTimeout(timer);
            }
        }

        // Remember successful searches so a slow or offline API can still show something
        function readCache() {
            try { return JSON.parse(localStorage.getItem(CACHE_KEY)) || {}; } catch (e) { return {}; }
        }

        function saveCache(query, data) {
            try {
                const cache = readCache();
                cache[query.toLowerCase()] = { docs: data.docs, numFound: data.numFound };
                localStorage.setItem(CACHE_KEY, JSON.stringify(cache));
            } catch (e) { /* storage full or blocked: ignore */ }
        }

        async function searchBooks(query) {
            button.disabled = true;
            setStatus('Searching...');
            showSkeletons();

            try {
                let data;
                for (let attempt = 1; attempt <= 2; attempt++) {
                    try {
                        data = await fetchBooks(query);
                        break;
                    } catch (err) {
                        console.error('Attempt ' + attempt + ' failed:', err);
                        if (attempt === 2) throw err;
                        setStatus('Open Library is responding slowly... trying again.');
                    }
                }
                saveCache(query, data);
                renderBooks(data.docs, query, data.numFound);
            } catch (err) {
                const cached = readCache()[query.toLowerCase()];
                if (cached) {
                    renderBooks(cached.docs, query, cached.numFound);
                    setStatus('⚠️ Open Library is not responding, showing your saved results for "' + query + '".');
                } else {
                    showError(query);
                }
            } finally {
                button.disabled = false;
            }
        }

        function showError(query) {
            resultsEl.replaceChildren();
            setStatus('Open Library is not responding right now (the service may be down or slow). Please try again in a moment.', true);
            const retry = document.createElement('button');
            retry.type = 'button';
            retry.className = 'retry-btn';
            retry.textContent = '↻ Try again';
            retry.addEventListener('click', () => searchBooks(query));
            resultsEl.appendChild(retry);
        }

        function buildPlaceholder() {
            const placeholder = document.createElement('div');
            placeholder.className = 'no-cover';
            placeholder.textContent = '📚';
            return placeholder;
        }

        // cover_i is often missing, so try other IDs the API gives us, then fall back to a placeholder.
        // "?default=false" makes Open Library answer 404 (instead of a blank image) when it has no cover.
        function coverCandidates(book) {
            const urls = [];
            if (book.cover_i) urls.push(COVER_URL + book.cover_i + '-M.jpg?default=false');
            if (book.cover_edition_key) urls.push('https://covers.openlibrary.org/b/olid/' + book.cover_edition_key + '-M.jpg?default=false');
            return urls;
        }

        function buildCover(book) {
            const urls = coverCandidates(book);
            const img = document.createElement('img');
            img.className = 'cover';
            img.alt = 'Cover of ' + book.title;
            img.loading = 'lazy';

            let next = 0;
            let triedEditions = false;
            img.addEventListener('error', async () => {
                next += 1;
                if (next < urls.length) { img.src = urls[next]; return; }   // try the next source

                // Last resort: look through every edition of this work for any cover
                if (!triedEditions) {
                    triedEditions = true;
                    const id = await findEditionCover(book.key);
                    if (id) { img.src = COVER_URL + id + '-M.jpg?default=false'; return; }
                }
                img.replaceWith(buildPlaceholder());                         // nothing worked
            });
            // Books with no known cover ID at all go straight to the edition search
            if (urls.length) img.src = urls[0];
            else img.dispatchEvent(new Event('error'));
            return img;
        }

        async function findEditionCover(workKey) {
            try {
                const res = await fetch('https://openlibrary.org' + workKey + '/editions.json?limit=50');
                if (!res.ok) return null;
                const data = await res.json();
                const edition = data.entries.find((e) => e.covers && e.covers.some((id) => id > 0));
                return edition ? edition.covers.find((id) => id > 0) : null;
            } catch (err) {
                return null;
            }
        }

        // Step 5: createElement -> set content -> appendChild
        function renderBooks(books, query, total) {
            resultsEl.replaceChildren();

            // Empty state
            if (!books.length) {
                setStatus('😕 No books found for "' + query + '". Try a different title.');
                return;
            }
            setStatus('Showing ' + books.length + ' of ' + total.toLocaleString() + ' results for "' + query + '"');

            books.forEach((book, i) => {
                const card = document.createElement('a');
                card.className = 'book-card';
                card.href = 'https://openlibrary.org' + book.key;
                card.target = '_blank';
                card.rel = 'noopener';
                card.style.animationDelay = i * 0.05 + 's';

                card.appendChild(buildCover(book));

                const info = document.createElement('div');
                info.className = 'book-info';

                const title = document.createElement('h2');
                title.className = 'book-title';
                title.textContent = book.title;

                const author = book.author_name ? book.author_name[0] : 'Unknown author';
                const year = book.first_publish_year || 'Year unknown';
                const meta = document.createElement('p');
                meta.className = 'book-meta';
                meta.textContent = author + ' · ' + year;

                info.append(title, meta);
                card.appendChild(info);
                resultsEl.appendChild(card);
            });
        }

        // Start with a sample search so the page isn't empty
        input.value = 'harry potter';
        searchBooks('harry potter');
    </script>
</body>

</html>
