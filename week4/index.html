<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Week 4 - Web Programming</title>
  <style>
    :root { --green: #39ff7a; --dim: #1f9d4d; --bg: #04100a; --muted: #5fbf86; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 24px; display: grid; place-items: center;
      font-family: "Cascadia Code", "Fira Code", Consolas, monospace; color: var(--green); background: var(--bg);
    }
    /* CRT scanlines + moving sweep */
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 5;
      background: repeating-linear-gradient(transparent 0 2px, rgba(0,0,0,.28) 2px 4px);
    }
    body::after {
      content: ""; position: fixed; left: 0; right: 0; height: 120px; top: -120px; pointer-events: none; z-index: 4;
      background: linear-gradient(transparent, rgba(57,255,122,.07), transparent); animation: sweep 6s linear infinite;
    }
    @keyframes sweep { to { top: 100vh; } }
    .container {
      width: min(900px, 100%); padding: 28px; border: 1px solid var(--dim); border-radius: 10px; background: rgba(4,20,12,.9);
      box-shadow: 0 0 40px rgba(57,255,122,.18), inset 0 0 40px rgba(57,255,122,.05); animation: boot .8s steps(8) both;
    }
    @keyframes boot { from { opacity: 0; filter: brightness(3); } }
    .header { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 1.6rem; font-weight: 700; text-shadow: 0 0 10px var(--green); }
    h1::before { content: "$ cd "; color: var(--dim); }
    h1::after { content: "\258D"; margin-left: 4px; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .back-link { color: var(--muted); text-decoration: none; transition: color .2s, text-shadow .2s; }
    .back-link:hover { color: var(--green); text-shadow: 0 0 10px var(--green); }
    #search {
      width: 100%; padding: 12px 14px; margin-bottom: 20px; font: inherit; color: var(--green);
      background: #000; border: 1px solid var(--dim); border-radius: 6px; caret-color: var(--green);
    }
    #search::placeholder { color: var(--dim); }
    #search:focus { outline: none; border-color: var(--green); box-shadow: 0 0 16px rgba(57,255,122,.45); }
    .link-list { display: grid; gap: 8px; }
    .item-link {
      display: block; padding: 11px 14px; border: 1px solid var(--dim); border-radius: 6px; color: var(--green); text-decoration: none;
      opacity: 0; animation: type-in .5s steps(10) forwards; transition: background .15s, color .15s, padding-left .2s, box-shadow .2s;
    }
    .item-link::before { content: "> "; color: var(--dim); }
    .item-link:hover { background: var(--green); color: #002b12; padding-left: 24px; box-shadow: 0 0 22px rgba(57,255,122,.6); }
    .item-link:hover::before { color: #002b12; content: ">> "; }
    @keyframes type-in { from { opacity: 0; clip-path: inset(0 100% 0 0); } to { opacity: 1; clip-path: inset(0 0 0 0); } }
    #empty-state { margin-top: 14px; color: var(--muted); display: none; }
    #empty-state::before { content: "error: "; color: #ff5d5d; }
    .item-link:nth-child(1) { animation-delay: 0.52s; }
    .item-link:nth-child(2) { animation-delay: 0.64s; }
    .item-link:nth-child(3) { animation-delay: 0.76s; }
    .item-link:nth-child(4) { animation-delay: 0.88s; }
    .item-link:nth-child(5) { animation-delay: 1.00s; }
    .item-link:nth-child(6) { animation-delay: 1.12s; }
    .item-link:nth-child(7) { animation-delay: 1.24s; }
    .item-link:nth-child(8) { animation-delay: 1.36s; }
    .item-link:nth-child(9) { animation-delay: 1.48s; }
    .item-link:nth-child(10) { animation-delay: 1.60s; }
    .item-link:nth-child(11) { animation-delay: 1.72s; }
    .item-link:nth-child(12) { animation-delay: 1.84s; }

    /* ---- glassmorphism: colourful blobs behind frosted panels ---- */
    body::before, body::after {
      content: ""; position: fixed; inset: auto; z-index: -1; pointer-events: none; mask-image: none; clip-path: none;
      width: 46vmax; height: 46vmax; border-radius: 50%; filter: blur(70px); opacity: .6;
      background: none; transform: none; animation: gdrift 20s ease-in-out infinite alternate;
    }
    body::before { background-color: #0fd16a; top: -14vmax; left: -12vmax; }
    body::after { background-color: #0aa6a6; bottom: -16vmax; right: -12vmax; animation-duration: 26s; animation-direction: alternate-reverse; }
    @keyframes gdrift { to { transform: translate(12vmax, 8vmax) scale(1.2); } }
    .container { background: rgba(255,255,255,.06); border: 1px solid rgba(57,255,122,.3); backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%); box-shadow: 0 8px 40px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.25); }
    .item-link, #search {
      background: rgba(57,255,122,.07); border: 1px solid rgba(57,255,122,.28); backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.18);
    }
    .item-link { border-radius: 12px; }
    .item-link:hover { background: rgba(57,255,122,.24); color: #eaffef; box-shadow: 0 8px 30px rgba(57,255,122,.35), inset 0 1px 0 rgba(255,255,255,.35); }
    .item-link:hover::before { color: #eaffef; }

    /* ---- unified soft glass palette (weeks 2-6) ---- */
    :root { --acc: #a5b4ff; --txt: #eef1ff; --soft: #aab3d6; --line: rgba(255,255,255,.18); --pane: rgba(255,255,255,.08); }
    body { background: linear-gradient(160deg, #0f1226, #181c3a 60%, #121631) fixed; color: var(--txt); animation: none; }
    body::before, body::after {
      content: ""; position: fixed; z-index: -1; pointer-events: none; mask-image: none; clip-path: none; transform: none;
      left: auto; right: auto; top: auto; bottom: auto; margin: 0; width: 46vmax; height: 46vmax; border-radius: 50%;
      filter: blur(90px); opacity: .28; background: none; animation: gdrift 24s ease-in-out infinite alternate;
    }
    body::before { background-color: #6366f1; top: -14vmax; left: -12vmax; }
    body::after { background-color: #14b8a6; bottom: -16vmax; right: -12vmax; animation-duration: 30s; animation-direction: alternate-reverse; }
    @keyframes gdrift { to { transform: translate(10vmax, 6vmax) scale(1.15); } }
    h1 {
      color: #fff; background: none; border: 0; box-shadow: none; padding: 0; border-radius: 0; transform: none;
      -webkit-text-fill-color: #fff; text-shadow: 0 2px 20px rgba(165,180,255,.35); animation: none;
    }
    h2 { color: var(--acc); background: none; border: 0; box-shadow: none; padding: 0; text-shadow: none; }
    .container, .section, .item-link, #search, .back-link {
      color: var(--txt); background: var(--pane); border: 1px solid var(--line);
      box-shadow: 0 8px 32px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.2);
      backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); text-shadow: none;
    }
    .container { border-radius: 26px; }
    .section { border-radius: 20px; transform: none; }
    .section:nth-child(1), .section:nth-child(2) { background: var(--pane); border-color: var(--line); transform: none; }
    .item-link { border-radius: 14px; font-weight: 500; }
    .item-link::before { color: var(--acc); }
    .item-link:hover, .item-link:hover::before {
      color: #fff; background: rgba(255,255,255,.16); border-color: var(--acc);
      box-shadow: 0 10px 30px rgba(99,102,241,.35), inset 0 1px 0 rgba(255,255,255,.3);
    }
    .back-link { color: var(--acc); border-radius: 999px; padding: 8px 16px; font-weight: 600; }
    .back-link:hover { color: #fff; border-color: var(--acc); }
    #search { border-radius: 14px; }
    #search::placeholder { color: var(--soft); }
    #search:focus { border-color: var(--acc); box-shadow: 0 0 0 4px rgba(165,180,255,.2); }
    #empty-state { color: var(--soft); }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main class="container">
    <div class="header">
      <h1>Week 4</h1>
      <a class="back-link" href="../index.html">← Back to Main</a>
    </div>

    <input id="search" type="search" placeholder="Filter exercises by title" aria-label="Filter links">

    <nav class="link-list" aria-label="Week 4 exercises">
      <a class="item-link" href="exercise_E1_click_counter.html">Exercise 1 - Click Counter</a>
      <a class="item-link" href="exercise_E2_class_toggle.html">Exercise 2 - Class Toggle</a>
      <a class="item-link" href="exercise_E3_live_to_do_list.html">Exercise 3 - Live To-Do List</a>
      <a class="item-link" href="exercise_E4_event_delegation.html">Exercise 4 - Event Delegation</a>
      <a class="item-link" href="homework_interactive_color_palette.html">Homework - Interactive Color Palette</a>
    </nav>

    <p id="empty-state">No matching exercises found.</p>
  </main>

  <script>
    const search = document.getElementById("search");
    const links = [...document.querySelectorAll(".item-link")];
    const emptyState = document.getElementById("empty-state");

    search.addEventListener("input", (event) => {
      const query = event.target.value.trim().toLowerCase();
      let visibleCount = 0;

      links.forEach((link) => {
        const visible = link.textContent.toLowerCase().includes(query) || link.getAttribute("href").toLowerCase().includes(query);
        link.style.display = visible ? "block" : "none";
        if (visible) visibleCount += 1;
      });

      emptyState.style.display = visibleCount ? "none" : "block";
    });
  </script>
</body>
</html>
