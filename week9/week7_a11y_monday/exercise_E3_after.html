<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign Up - Week 7 Monday E3 (after fixes)</title>
    <style>
        body { font-family: system-ui; padding: 24px; max-width: 400px; margin: 0 auto; color: #1a2340; }
        label { display: block; font-weight: 600; font-size: 14px; margin: 12px 0 4px; }
        input { width: 100%; padding: 8px; border: 2px solid #767676; border-radius: 6px; font-size: 15px; margin-bottom: 4px; }
        /* Fix 3b: dark red (7:1 on white) so the message also passes colour contrast */
        .error { color: #b42318; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
        button { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; }
        .icon-btn { background: #1a7f5a; color: white; width: 36px; height: 36px; font-size: 18px; border-radius: 50%; }
        .submit-btn { background: #1a56db; color: white; padding: 10px 24px; font-size: 15px; width: 100%; margin-top: 8px; }
        a img { display: block; width: 80px; }
        a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid #1a56db; outline-offset: 3px; }
        .back { display: inline-block; margin-bottom: 12px; color: #1a56db; font-size: 14px; }
    </style>
</head>

<body>
    <main>
        <a class="back" href="../index.html">← Week 9</a>
        <h1>Sign Up</h1>

        <!-- Fix 1: icon-only button now has an accessible name -->
        <button type="button" class="icon-btn" aria-label="Search">🔍</button>

        <!-- Fix 2: the input now has a real <label> -->
        <label for="email-field">Email address</label>
        <input type="email" placeholder="you@example.com" id="email-field" aria-describedby="email-err">
        <div class="error" id="email-err">⚠️ Error: Please enter a valid email address.</div>

        <!-- Fix 3: don't rely on colour alone - the message starts with the word "Error:" and an icon -->
        <div class="error" role="alert">⚠️ Error: Password too short. Must be 8+ characters.</div>

        <button type="submit" class="submit-btn">Create account</button>

        <!-- Fix 4: the linked image's alt describes where the link goes -->
        <a href="/about" style="margin-top:16px; display:inline-block">
            <img src="img/logo.svg" alt="Learn about our team" style="background:#e0eaff;width:80px;height:40px;border-radius:4px">
        </a>
    </main>
</body>

</html>
