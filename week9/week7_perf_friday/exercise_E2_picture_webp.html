    <a href="../index.html">← Week 9</a>
    <h1>Image Format Practice</h1>

    <!-- WebP first, JPEG fallback; srcset lets the browser pick 400w or 800w;
         width/height reserve space (no layout shift); fetchpriority because this is the hero image. -->
    <picture>
      <source type="image/webp"
              srcset="https://picsum.photos/id/1043/400/200.webp 400w, https://picsum.photos/id/1043/800/400.webp 800w"
              sizes="(max-width: 480px) 400px, 800px">
      <img src="https://picsum.photos/id/1043/800/400.jpg"
           srcset="https://picsum.photos/id/1043/400/200.jpg 400w, https://picsum.photos/id/1043/800/400.jpg 800w"
           sizes="(max-width: 480px) 400px, 800px"
           alt="Calm lake surrounded by trees at dusk"
           width="800" height="400" fetchpriority="high">
    </picture>

    <p>Open DevTools → Network → Img, reload, and compare the WebP request with the JPEG one. A browser that supports WebP never downloads the JPEG.</p>
  </main>
</body>
