<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topic 09 — background-color Property</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            padding: 32px 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .box {
            padding: 16px 20px;
            border-radius: 8px;
            margin-bottom: 14px;
            font-size: 0.95rem;
        }

        .banner {
            background-color: #15803d;
            color: #ffffff;
        }

        .warning {
            background-color: #fef3c7;
            color: #92400e;
            border-left: 4px solid #f59e0b;
        }

        .dark {
            background-color: #1e293b;
            color: #f8fafc;
        }
    </style>
</head>

<body>
    <div class="box banner">Banner: solid background with high contrast text.</div>
    <div class="box warning">Notice: warning message with colored background.</div>
    <div class="box dark">Dark theme surface box.</div>
</body>

</html>
