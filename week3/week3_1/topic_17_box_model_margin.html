<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topic 17 — Box Model: Margin</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            padding: 32px 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .box {
            background: #ecfdf5;
            border: 1px solid #10b981;
            padding: 14px;
            border-radius: 6px;
        }

        .spaced {
            margin-bottom: 24px;
        }

        .centered {
            width: 280px;
            margin: 0 auto;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="box spaced">Box with margin-bottom: 24px</div>
    <div class="box centered">Centered block via margin: 0 auto</div>
</body>

</html>
