<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topic 08 — color Property</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            padding: 32px 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        h2 {
            color: #10b981;
            margin-bottom: 16px;
        }

        .named {
            color: crimson;
        }

        .hex {
            color: #15803d;
        }

        .rgb {
            color: rgb(29, 78, 216);
        }

        .hsl {
            color: hsl(262, 83%, 58%);
        }

        .muted {
            color: #64748b;
        }

        p {
            margin-bottom: 8px;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <h2>Text Colors via color Property</h2>
    <p class="named">Named color: crimson</p>
    <p class="hex">Hex color: #15803d</p>
    <p class="rgb">RGB color: rgb(29, 78, 216)</p>
    <p class="hsl">HSL color: hsl(262, 83%, 58%)</p>
    <p class="muted">Muted text: #64748b</p>
</body>

</html>
