<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topic 14 — font-style Property</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            padding: 32px 20px;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .normal {
            font-style: normal;
        }

        .italic {
            font-style: italic;
        }

        blockquote {
            font-style: italic;
            color: #475569;
            border-left: 3px solid #10b981;
            padding-left: 16px;
            margin: 16px 0;
        }
    </style>
</head>

<body>
    <p class="normal">Standard upright text style.</p>
    <p class="italic">Italicized text using CSS font-style.</p>
    <blockquote>"CSS defines presentation separately from HTML structure."</blockquote>
</body>

</html>
