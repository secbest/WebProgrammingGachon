<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topic 25 — Putting It All Together</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            line-height: 1.6;
            padding: 40px 20px;
        }

        .profile-card {
            max-width: 420px;
            margin: 0 auto;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 28px;
            text-align: center;
        }

        .avatar {
            width: 64px;
            height: 64px;
            background-color: #15803d;
            color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0 auto 16px;
        }

        h1 {
            font-size: 1.4rem;
            color: #15803d;
            margin-bottom: 4px;
        }

        .role {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 16px;
        }

        .tags {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 16px;
        }

        .badge {
            background: #dcfce7;
            color: #15803d;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 16px;
        }
    </style>
</head>

<body>
    <div class="profile-card">
        <div class="avatar">G</div>
        <h1>Web Programming</h1>
        <p class="role">Week 3 &middot; CSS Complete Integration</p>
        <p>Combining resets, typography, box model spacing, and Flexbox.</p>
        <div class="tags">
            <span class="badge">Reset</span>
            <span class="badge">Flexbox</span>
            <span class="badge">Box Model</span>
        </div>
    </div>
</body>

</html>
