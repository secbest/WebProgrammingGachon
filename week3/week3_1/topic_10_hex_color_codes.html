<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topic 10 — Hex Color Codes</title>
    <style>
        body {
            font-family: monospace;
            padding: 32px 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .swatch {
            display: inline-block;
            padding: 10px 16px;
            margin: 4px;
            border-radius: 6px;
            font-weight: bold;
        }

        .red {
            background-color: #ff0000;
            color: #fff;
        }

        .green {
            background-color: #00aa44;
            color: #fff;
        }

        .blue {
            background-color: #0000ff;
            color: #fff;
        }

        .dark {
            background-color: #1e293b;
            color: #fff;
        }

        .short {
            background-color: #f00;
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="swatch red">#FF0000</div>
    <div class="swatch green">#00AA44</div>
    <div class="swatch blue">#0000FF</div>
    <div class="swatch dark">#1E293B</div>
    <div class="swatch short">#F00 (3-digit)</div>
</body>

</html>
