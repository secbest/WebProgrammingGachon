<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topic 19 — display: block</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            padding: 32px 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        a.block-link {
            display: block;
            background-color: #1e293b;
            color: #ffffff;
            padding: 10px 16px;
            text-decoration: none;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        a.block-link:hover {
            background-color: #15803d;
        }
    </style>
</head>

<body>
    <a href="#" class="block-link">Block Nav Link 1</a>
    <a href="#" class="block-link">Block Nav Link 2</a>
</body>

</html>
