<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topic 07 — Type Selector</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            padding: 32px 20px;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        h1 {
            color: #15803d;
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        h2 {
            color: #1d4ed8;
            font-size: 1.3rem;
            margin-top: 16px;
            margin-bottom: 8px;
        }

        p {
            color: #334155;
            margin-bottom: 12px;
        }

        a {
            color: #10b981;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        p.lead {
            font-size: 1.15rem;
            font-weight: 500;
            color: #0f172a;
        }
    </style>
</head>

<body>
    <h1>Main Heading</h1>
    <h2>Subheading</h2>
    <p class="lead">Lead paragraph styled using a type and class combinator.</p>
    <p>Standard paragraph element. <a href="#">Learn more</a></p>
</body>

</html>
