<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three Ways to Add CSS</title>

    <!-- METHOD 1: External stylesheet (BEST for real projects) -->
    <link rel="stylesheet" href="style.css">

    <!-- METHOD 2: Internal <style> block (good for single pages / demos) -->
    <style>
        body {
            max-width: 600px;
            margin: 40px auto;
            padding: 0 16px;
            line-height: 1.6;
        }

        h2 {
            color: #15803d;
            margin-top: 24px;
        }

        p {
            font-family: Georgia, serif;
        }
    </style>
</head>

<body>
    <!-- METHOD 3: Inline style attribute (avoid — hard to maintain) -->
    <p style="color: #dc2626; font-size: 20px;">Inline styled paragraph.</p>

    <h2>Internal style heading</h2>
    <p>Internal style paragraph.</p>
</body>

</html>
