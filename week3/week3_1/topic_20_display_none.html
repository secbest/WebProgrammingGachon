<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topic 20 — display: none</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            padding: 32px 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .box {
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div class="box">Visible Item 1</div>
    <div class="box hidden">Hidden Item (occupies zero space)</div>
    <div class="box">Visible Item 2</div>
</body>

</html>
