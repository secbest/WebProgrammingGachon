<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topic 12 — font-size Property</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            padding: 32px 20px;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.5;
        }

        .small {
            font-size: 0.875rem;
            color: #64748b;
        }

        .base {
            font-size: 1rem;
            color: #334155;
        }

        .medium {
            font-size: 1.25rem;
            font-weight: 600;
            color: #1e293b;
        }

        .large {
            font-size: 1.75rem;
            font-weight: 700;
            color: #15803d;
        }
    </style>
</head>

<body>
    <p class="large">1.75rem (~28px) Heading Scale</p>
    <p class="medium">1.25rem (~20px) Subtitle Scale</p>
    <p class="base">1rem (16px base) Standard Body</p>
    <p class="small">0.875rem (~14px) Caption Text</p>
</body>

</html>
