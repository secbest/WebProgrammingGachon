<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Topic 06 — Class Selector</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f8fafc;
      padding: 40px 20px;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Base class selector */
    .card {
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 18px 20px;
      margin-bottom: 16px;
      color: #334155;
      line-height: 1.5;
    }

    /* Additional modifier classes layered on top */
    .featured {
      border-color: #10b981;
      background-color: #ecfdf5;
      color: #065f46;
    }

    .large {
      font-size: 1.15rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    Standard card styling using <code>.card</code>.
  </div>

  <div class="card featured">
    Featured card combining <code>.card</code> and <code>.featured</code>.
  </div>

  <div class="card featured large">
    Large featured card combining three classes.
  </div>
</body>
</html>
