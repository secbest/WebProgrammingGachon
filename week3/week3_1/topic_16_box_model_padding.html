<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topic 16 — Box Model: Padding</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            padding: 32px 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .box {
            background: #ecfdf5;
            border: 2px solid #10b981;
            border-radius: 6px;
            margin-bottom: 16px;
        }

        .p-small {
            padding: 8px;
        }

        .p-large {
            padding: 24px;
        }

        .p-asym {
            padding: 12px 32px;
        }
    </style>
</head>

<body>
    <div class="box p-small">Padding: 8px</div>
    <div class="box p-large">Padding: 24px</div>
    <div class="box p-asym">Padding: 12px (vertical) 32px (horizontal)</div>
</body>

</html>
