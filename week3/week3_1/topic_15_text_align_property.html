<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topic 15 — text-align Property</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            padding: 32px 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .box {
            border: 1px solid #e2e8f0;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 6px;
        }

        .left {
            text-align: left;
        }

        .center {
            text-align: center;
        }

        .right {
            text-align: right;
        }
    </style>
</head>

<body>
    <div class="box left">Left-aligned content (default).</div>
    <div class="box center">Center-aligned content.</div>
    <div class="box right">Right-aligned content.</div>
</body>

</html>
