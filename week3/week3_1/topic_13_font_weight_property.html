<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topic 13 — font-weight Property</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            padding: 32px 20px;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.7;
            font-size: 1.1rem;
        }

        .w300 {
            font-weight: 300;
        }

        .w400 {
            font-weight: 400;
        }

        .w600 {
            font-weight: 600;
        }

        .w700 {
            font-weight: 700;
        }
    </style>
</head>

<body>
    <p class="w300">font-weight: 300 (Light)</p>
    <p class="w400">font-weight: 400 (Regular / Normal)</p>
    <p class="w600">font-weight: 600 (Semi-Bold)</p>
    <p class="w700">font-weight: 700 (Bold)</p>
</body>

</html>
