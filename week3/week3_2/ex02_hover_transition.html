<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 2 - Hover Card with Transition</title>
    <style>
        body {
            padding: 40px;
            background: #f0fdfa;
            font-family: sans-serif;
        }

        .card {
            background: white;
            border: 2px solid #14b8a6;
            border-radius: 12px;
            padding: 24px;
            width: 240px;
            color: #0f766e;
            font-size: 16px;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 28px rgba(15, 118, 110, 0.25);
        }
    </style>
</head>

<body>
    <div class="card">Hover over me!</div>
</body>

</html>
