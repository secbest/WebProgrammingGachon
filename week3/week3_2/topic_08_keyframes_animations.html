<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topic 08 - Keyframes & Animations</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
        }

        /* Fade + slide in */
        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Pulse */
        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.1);
                opacity: 0.7;
            }
        }

        /* Spinning loader */
        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .hero {
            animation: fadeSlideIn 0.8s ease-out forwards;
            font-size: 28px;
            font-weight: bold;
            color: #0f766e;
            padding: 20px 0;
        }

        .badge {
            display: inline-block;
            background: #0f766e;
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #ccfbf1;
            border-top-color: #0f766e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 20px 0;
        }
    </style>
</head>

<body>
    <div class="hero">Hello! I faded and slid in on load.</div>
    <span class="badge">Live</span>
    <div class="spinner"></div>
</body>

</html>
