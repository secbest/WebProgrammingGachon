<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Week 3 - Web Programming</title>
  <link rel="stylesheet" href="../assets/index-glass.css">
</head>
<body>
  <main class="container">
    <div class="header">
      <h1>Week 3</h1>
      <a class="back-link" href="../index.html">← Back to Main</a>
    </div>

    <input id="search" type="search" placeholder="Filter links by title or file name" aria-label="Filter links">

    <div class="section-grid">
      <section class="section">
        <h2>week3_1</h2>
        <a class="item-link" href="week3_1/exercise_E1_heading.html">Exercises</a>
        <a class="item-link" href="week3_1/topic_01_what_is_css.html">Topics</a>
      </section>

      <section class="section">
        <h2>week3_2</h2>
        <a class="item-link" href="week3_2/ex01_position_badge.html">Exercises</a>
        <a class="item-link" href="week3_2/topic_01_position_static_relative.html">Topics</a>
      </section>
    </div>

    <p id="empty-state">No matching links found.</p>
  </main>

  <script>
    const search = document.getElementById("search");
    const links = [...document.querySelectorAll(".item-link")];
    const sections = [...document.querySelectorAll(".section")];
    const emptyState = document.getElementById("empty-state");

    search.addEventListener("input", (event) => {
      const query = event.target.value.trim().toLowerCase();
      let visibleCount = 0;

      links.forEach((link) => {
        const visible = link.textContent.toLowerCase().includes(query) || link.getAttribute("href").toLowerCase().includes(query);
        link.style.display = visible ? "block" : "none";
        if (visible) visibleCount += 1;
      });

      sections.forEach((section) => {
        const hasVisible = [...section.querySelectorAll(".item-link")].some((item) => item.style.display !== "none");
        section.style.display = hasVisible ? "block" : "none";
      });

      emptyState.style.display = visibleCount ? "none" : "block";
    });
  </script>
</body>
</html>
