<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Week 3 - Web Programming</title>
  <style>
    :root { --ink: #111; --paper: #fff6dc; --yellow: #ffd23f; --pink: #ff6b9d; --blue: #4cc9f0; --muted: #444; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 24px; display: grid; place-items: center;
      font-family: "Inter", "Segoe UI", Arial, sans-serif; color: var(--ink);
      background-color: var(--paper); background-image: radial-gradient(var(--ink) 1.2px, transparent 1.2px); background-size: 22px 22px;
      animation: dots 12s linear infinite;
    }
    @keyframes dots { to { background-position: 22px 22px; } }
    .container { width: min(900px, 100%); }
    .header { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
    h1 {
      margin: 0; font-size: 2.2rem; padding: 6px 18px; background: var(--yellow); border: 4px solid var(--ink);
      box-shadow: 6px 6px 0 var(--ink); transform: rotate(-2deg); animation: wobble 3s ease-in-out infinite;
    }
    @keyframes wobble { 50% { transform: rotate(2deg) translateY(-3px); } }
    .back-link {
      color: var(--ink); text-decoration: none; font-weight: 800; padding: 8px 14px; background: var(--blue);
      border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); transition: transform .12s, box-shadow .12s;
    }
    .back-link:hover { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--ink); }
    #search {
      width: 100%; padding: 13px 16px; margin-bottom: 24px; font-size: 1rem; background: #fff; color: var(--ink);
      border: 4px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); transition: transform .15s, box-shadow .15s;
    }
    #search:focus { outline: none; transform: translate(-2px, -2px); box-shadow: 9px 9px 0 var(--pink); }
    .section-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px; }
    .section {
      padding: 18px; background: #fff; border: 4px solid var(--ink); box-shadow: 8px 8px 0 var(--ink);
      animation: bounce-in .7s cubic-bezier(.3,1.6,.5,1) both; transition: transform .2s;
    }
    .section:nth-child(1) { transform: rotate(-1deg); background: #ffe6f0; }
    .section:nth-child(2) { transform: rotate(1deg); background: #e0f7ff; animation-delay: .15s; }
    .section:hover { transform: rotate(0) scale(1.02); }
    @keyframes bounce-in { from { opacity: 0; transform: scale(.6) rotate(-8deg); } }
    h2 { margin: 0 0 14px; display: inline-block; padding: 2px 10px; background: var(--ink); color: var(--yellow); font-size: 1rem; letter-spacing: 1px; }
    .item-link {
      display: block; padding: 11px 14px; margin: 12px 0; background: var(--yellow); color: var(--ink);
      border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); text-decoration: none; font-weight: 800;
      transition: transform .12s, box-shadow .12s, background .12s;
    }
    .item-link:hover { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--ink); background: var(--pink); }
    .item-link:active { transform: translate(4px, 4px) scale(.97); }
    #empty-state { margin-top: 14px; font-weight: 800; display: none; }

    /* ---- glassmorphism: colourful blobs behind frosted panels ---- */
    body::before, body::after {
      content: ""; position: fixed; inset: auto; z-index: -1; pointer-events: none; mask-image: none; clip-path: none;
      width: 46vmax; height: 46vmax; border-radius: 50%; filter: blur(70px); opacity: .6;
      background: none; transform: none; animation: gdrift 20s ease-in-out infinite alternate;
    }
    body::before { background-color: #ffd23f; top: -14vmax; left: -12vmax; }
    body::after { background-color: #ff6b9d; bottom: -16vmax; right: -12vmax; animation-duration: 26s; animation-direction: alternate-reverse; }
    @keyframes gdrift { to { transform: translate(12vmax, 8vmax) scale(1.2); } }
    body { background: linear-gradient(135deg, #e0f2ff, #fde7f3 55%, #fff3cf) fixed; animation: none; color: #1d2440; }
    h1 {
      background: rgba(255,255,255,.35); border: 1px solid rgba(255,255,255,.7); border-radius: 22px; backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%);
      box-shadow: 0 8px 32px rgba(80,60,160,.18), inset 0 1px 0 rgba(255,255,255,.8);
    }
    .section, .item-link, #search, .back-link, h2 {
      background: rgba(255,255,255,.35); border: 1px solid rgba(255,255,255,.7); color: #1d2440; backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%);
      box-shadow: 0 8px 32px rgba(80,60,160,.15), inset 0 1px 0 rgba(255,255,255,.8);
    }
    .section { border-radius: 24px; }
    .section:nth-child(1), .section:nth-child(2) { transform: none; background: rgba(255,255,255,.3); }
    .section:hover { transform: translateY(-4px); }
    .item-link { border-radius: 14px; }
    .item-link:hover { transform: translateY(-3px); background: rgba(255,255,255,.6); box-shadow: 0 14px 34px rgba(255,107,157,.3), inset 0 1px 0 #fff; }
    .item-link:active { transform: scale(.97); }
    .back-link { border-radius: 999px; }
    .back-link:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(80,60,160,.2); }
    h2 { border-radius: 999px; font-size: .95rem; }
    #search { border-radius: 16px; }
    #search:focus { transform: none; box-shadow: 0 0 0 4px rgba(255,107,157,.3); }

    /* ---- unified soft glass palette (weeks 2-6) ---- */
    :root { --acc: #a5b4ff; --txt: #eef1ff; --soft: #aab3d6; --line: rgba(255,255,255,.18); --pane: rgba(255,255,255,.08); }
    body { background: linear-gradient(160deg, #0f1226, #181c3a 60%, #121631) fixed; color: var(--txt); animation: none; }
    body::before, body::after {
      content: ""; position: fixed; z-index: -1; pointer-events: none; mask-image: none; clip-path: none; transform: none;
      left: auto; right: auto; top: auto; bottom: auto; margin: 0; width: 46vmax; height: 46vmax; border-radius: 50%;
      filter: blur(90px); opacity: .28; background: none; animation: gdrift 24s ease-in-out infinite alternate;
    }
    body::before { background-color: #6366f1; top: -14vmax; left: -12vmax; }
    body::after { background-color: #14b8a6; bottom: -16vmax; right: -12vmax; animation-duration: 30s; animation-direction: alternate-reverse; }
    @keyframes gdrift { to { transform: translate(10vmax, 6vmax) scale(1.15); } }
    h1 {
      color: #fff; background: none; border: 0; box-shadow: none; padding: 0; border-radius: 0; transform: none;
      -webkit-text-fill-color: #fff; text-shadow: 0 2px 20px rgba(165,180,255,.35); animation: none;
    }
    h2 { color: var(--acc); background: none; border: 0; box-shadow: none; padding: 0; text-shadow: none; }
    .container, .section, .item-link, #search, .back-link {
      color: var(--txt); background: var(--pane); border: 1px solid var(--line);
      box-shadow: 0 8px 32px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.2);
      backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); text-shadow: none;
    }
    .container { border-radius: 26px; padding: 28px; }
    .section { border-radius: 20px; transform: none; }
    .section:nth-child(1), .section:nth-child(2) { background: var(--pane); border-color: var(--line); transform: none; }
    .item-link { border-radius: 14px; font-weight: 500; }
    .item-link::before { color: var(--acc); }
    .item-link:hover, .item-link:hover::before {
      color: #fff; background: rgba(255,255,255,.16); border-color: var(--acc);
      box-shadow: 0 10px 30px rgba(99,102,241,.35), inset 0 1px 0 rgba(255,255,255,.3);
    }
    .back-link { color: var(--acc); border-radius: 999px; padding: 8px 16px; font-weight: 600; }
    .back-link:hover { color: #fff; border-color: var(--acc); }
    #search { border-radius: 14px; }
    #search::placeholder { color: var(--soft); }
    #search:focus { border-color: var(--acc); box-shadow: 0 0 0 4px rgba(165,180,255,.2); }
    #empty-state { color: var(--soft); }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main class="container">
    <div class="header">
      <h1>Week 3</h1>
      <a class="back-link" href="../index.html">← Back to Main</a>
    </div>

    <input id="search" type="search" placeholder="Filter links by title or file name" aria-label="Filter links">

    <div class="section-grid">
      <section class="section">
        <h2>week3_1</h2>
        <a class="item-link" href="week3_1/exercise_E1_heading.html">Exercises</a>
        <a class="item-link" href="week3_1/topic_01_what_is_css.html">Topics</a>
      </section>

      <section class="section">
        <h2>week3_2</h2>
        <a class="item-link" href="week3_2/ex01_position_badge.html">Exercises</a>
        <a class="item-link" href="week3_2/topic_01_position_static_relative.html">Topics</a>
      </section>
    </div>

    <p id="empty-state">No matching links found.</p>
  </main>

  <script>
    const search = document.getElementById("search");
    const links = [...document.querySelectorAll(".item-link")];
    const sections = [...document.querySelectorAll(".section")];
    const emptyState = document.getElementById("empty-state");

    search.addEventListener("input", (event) => {
      const query = event.target.value.trim().toLowerCase();
      let visibleCount = 0;

      links.forEach((link) => {
        const visible = link.textContent.toLowerCase().includes(query) || link.getAttribute("href").toLowerCase().includes(query);
        link.style.display = visible ? "block" : "none";
        if (visible) visibleCount += 1;
      });

      sections.forEach((section) => {
        const hasVisible = [...section.querySelectorAll(".item-link")].some((item) => item.style.display !== "none");
        section.style.display = hasVisible ? "block" : "none";
      });

      emptyState.style.display = visibleCount ? "none" : "block";
    });
  </script>
</body>
</html>
