<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Week 6 - E1 Login Form</title>
    <style>
        body { font-family: system-ui; padding: 30px; max-width: 400px; margin: 0 auto; }
        form { display: flex; flex-direction: column; gap: 12px; }
        label { font-size: 14px; font-weight: 600; color: #374151; }
        input[type="email"], input[type="password"] {
            padding: 10px 14px; border: 2px solid #c8d4f0;
            border-radius: 8px; font-size: 15px; width: 100%;
        }
        input:focus { border-color: #1a56db; outline: none; }
        .checkbox-row { display: flex; align-items: center; gap: 8px; }
        button { background: #1a56db; color: white; border: none;
            padding: 12px; border-radius: 8px; font-size: 15px;
            font-weight: 700; cursor: pointer; }
        #message { margin-top: 14px; font-weight: 600; color: #16a34a; min-height: 1.4em; }
        .back { display: inline-block; margin-bottom: 16px; color: #1a56db; text-decoration: none; font-size: 14px; }
    </style>
</head>

<body>
    <a class="back" href="../index.html">← Week 6</a>
    <h2>Sign In</h2>

    <form id="login-form" method="post" action="/login">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="pw">Password</label>
        <input type="password" id="pw" name="password" required>

        <div class="checkbox-row">
            <input type="checkbox" id="remember" name="remember">
            <label for="remember">Remember me</label>
        </div>

        <button type="submit">Sign In</button>
    </form>
    <p id="message" aria-live="polite"></p>

    <script>
        // There is no server on a static site, so show a message instead of posting.
        // The browser's built-in validation (required, type="email") still runs first.
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            document.getElementById('message').textContent = '✅ Form is valid — it would be posted to /login.';
        });
    </script>
</body>

</html>
