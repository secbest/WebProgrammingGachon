<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Week 6 - PokeAPI Pokedex</title>
    <link rel="stylesheet" href="api-demo.css">
    <style>
        .poke { display: flex; gap: 24px; flex-wrap: wrap; align-items: center; }
        .poke img { width: 180px; height: 180px; image-rendering: pixelated; }
        .stats { flex: 1 1 260px; }
        .stat { display: grid; grid-template-columns: 110px 1fr 36px; gap: 8px; align-items: center; margin: 6px 0; font-size: .9rem; text-transform: capitalize; }
        .bar { height: 10px; border-radius: 999px; background: rgba(255,255,255,.12); overflow: hidden; }
        .bar span { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, #6366f1, #14b8a6); transition: width .8s ease; }
    </style>
</head>

<body>
    <main class="container">
        <div class="header">
            <h1>⚡ PokéAPI Pokédex</h1>
            <a class="back-link" href="index.html">← Week 6</a>
        </div>
        <p class="sub">Full Pokémon database. <span class="endpoint">pokeapi.co/api/v2/pokemon/pikachu</span></p>

        <form id="form" class="controls">
            <input id="name" type="text" value="pikachu" placeholder="Pokémon name or number" aria-label="Pokémon name" autocomplete="off">
            <button type="submit" id="search">Search</button>
            <button type="button" id="random">Random</button>
        </form>

        <div id="panel" class="panel" aria-live="polite"></div>
    </main>

    <script src="api-demo.js"></script>
    <script>
        const panel = document.querySelector('#panel');
        const form = document.querySelector('#form');
        const nameInput = document.querySelector('#name');
        const buttons = form.querySelectorAll('button');

        async function loadPokemon(query) {
            showLoading(panel);
            buttons.forEach((b) => (b.disabled = true));
            try {
                const response = await fetch('https://pokeapi.co/api/v2/pokemon/' + encodeURIComponent(query.toLowerCase()));
                if (response.status === 404) throw new Error('notfound');
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const p = await response.json();

                const card = el('div', 'card poke');
                const img = el('img');
                img.src = p.sprites.other['official-artwork'].front_default || p.sprites.front_default;
                img.alt = p.name;

                const info = el('div', 'stats');
                info.append(el('h3', '', '#' + p.id + ' ' + p.name));
                const types = el('div');
                p.types.forEach((t) => types.append(el('span', 'tag', t.type.name)));
                info.append(types);
                info.append(el('p', '', 'Height ' + p.height / 10 + ' m · Weight ' + p.weight / 10 + ' kg'));

                const bars = [];
                p.stats.forEach((s) => {
                    const row = el('div', 'stat');
                    const bar = el('div', 'bar');
                    const fill = el('span');
                    bar.append(fill);
                    row.append(el('span', '', s.stat.name.replace('-', ' ')), bar, el('span', '', s.base_stat));
                    info.append(row);
                    bars.push([fill, Math.min(100, (s.base_stat / 160) * 100)]);
                });

                card.append(img, info);
                panel.replaceChildren(card);
                // animate the bars after they're in the DOM
                requestAnimationFrame(() => requestAnimationFrame(() => bars.forEach(([f, w]) => (f.style.width = w + '%'))));
            } catch (err) {
                console.error(err);
                showError(panel, err.message === 'notfound'
                    ? 'No Pokémon called "' + query + '". Check the spelling and try again.'
                    : 'Could not reach PokéAPI. Please try again.');
            } finally {
                buttons.forEach((b) => (b.disabled = false));
            }
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (nameInput.value.trim()) loadPokemon(nameInput.value.trim());
        });
        document.querySelector('#random').addEventListener('click', () => {
            const id = Math.floor(Math.random() * 1025) + 1;
            nameInput.value = id;
            loadPokemon(String(id));
        });
        loadPokemon('pikachu');
    </script>
</body>

</html>
