<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Week 6 - REST Countries Table</title>
    <link rel="stylesheet" href="api-demo.css">
</head>

<body>
    <main class="container">
        <div class="header">
            <h1>🌍 REST Countries</h1>
            <a class="back-link" href="index.html">← Week 6</a>
        </div>
        <p class="sub">Flags, population and capitals. <span class="endpoint">restcountries.com/v3.1/name/korea</span></p>

        <form id="form" class="controls">
            <input id="query" type="text" value="korea" placeholder="Search a country (e.g. korea, japan, united)" aria-label="Country name" autocomplete="off">
            <button type="submit" id="search">Search</button>
        </form>

        <div id="panel" class="panel" aria-live="polite"></div>
    </main>

    <script src="api-demo.js"></script>
    <script>
        const panel = document.querySelector('#panel');
        const form = document.querySelector('#form');
        const queryInput = document.querySelector('#query');
        const searchBtn = document.querySelector('#search');

        // Offline sample (approximate figures), used only if the live API is unavailable.
        // REST Countries retired its v3.1 endpoint, so this keeps the page demonstrable.
        const SAMPLE = [
            { name: { common: 'South Korea' }, capital: ['Seoul'], population: 51700000, region: 'Asia', code: 'kr' },
            { name: { common: 'North Korea' }, capital: ['Pyongyang'], population: 26000000, region: 'Asia', code: 'kp' },
            { name: { common: 'Japan' }, capital: ['Tokyo'], population: 123000000, region: 'Asia', code: 'jp' },
            { name: { common: 'China' }, capital: ['Beijing'], population: 1410000000, region: 'Asia', code: 'cn' },
            { name: { common: 'United States' }, capital: ['Washington, D.C.'], population: 335000000, region: 'Americas', code: 'us' },
            { name: { common: 'United Kingdom' }, capital: ['London'], population: 67000000, region: 'Europe', code: 'gb' },
            { name: { common: 'France' }, capital: ['Paris'], population: 68000000, region: 'Europe', code: 'fr' },
            { name: { common: 'Brazil' }, capital: ['Brasília'], population: 215000000, region: 'Americas', code: 'br' }
        ];

        async function fetchCountries(query) {
            const url = 'https://restcountries.com/v3.1/name/' + encodeURIComponent(query) +
                '?fields=name,capital,population,region,flags';
            const response = await fetch(url);
            if (response.status === 404) throw new Error('notfound');
            if (!response.ok) throw new Error('HTTP ' + response.status);
            const data = await response.json();
            // A retired API version answers 200 with an error object instead of an array
            if (!Array.isArray(data)) throw new Error('deprecated');
            return { countries: data, live: true };
        }

        async function loadCountries(query) {
            showLoading(panel);
            searchBtn.disabled = true;
            try {
                let result;
                try {
                    result = await fetchCountries(query);
                } catch (err) {
                    if (err.message === 'notfound') throw err;
                    console.warn('Live API unavailable, using sample data:', err);
                    const q = query.toLowerCase();
                    const matches = SAMPLE.filter((c) => c.name.common.toLowerCase().includes(q));
                    if (!matches.length) throw new Error('notfound');
                    result = { countries: matches, live: false };
                }
                const countries = result.countries;
                countries.sort((a, b) => b.population - a.population);

                const table = el('table');
                const head = el('thead');
                const headRow = el('tr');
                ['Flag', 'Country', 'Capital', 'Region', 'Population'].forEach((h) => headRow.append(el('th', '', h)));
                head.append(headRow);

                const body = el('tbody');
                countries.forEach((c, i) => {
                    const row = el('tr');
                    row.style.animationDelay = i * 0.05 + 's';
                    const flagCell = el('td');
                    if (c.flags) {
                        const flag = el('img');
                        flag.src = c.flags.png;
                        flag.alt = c.flags.alt || 'Flag of ' + c.name.common;
                        flagCell.append(flag);
                    } else {
                        const flag = el('img');
                        flag.src = 'https://flagcdn.com/w80/' + c.code + '.png';
                        flag.alt = 'Flag of ' + c.name.common;
                        flagCell.append(flag);
                    }
                    row.append(
                        flagCell,
                        el('td', '', c.name.common),
                        el('td', '', (c.capital && c.capital.join(', ')) || '—'),
                        el('td', '', c.region),
                        el('td', '', c.population.toLocaleString())
                    );
                    body.append(row);
                });

                table.append(head, body);
                panel.replaceChildren(table);
                if (!result.live) {
                    panel.append(el('p', 'status', 'ℹ️ The live REST Countries API (v3.1) is no longer available, so this shows built-in sample data.'));
                }
            } catch (err) {
                console.error(err);
                showError(panel, err.message === 'notfound'
                    ? 'No countries match "' + query + '". Try another name.'
                    : 'Could not load countries. Please try again.');
            } finally {
                searchBtn.disabled = false;
            }
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (queryInput.value.trim()) loadCountries(queryInput.value.trim());
        });
        loadCountries('korea');
    </script>
</body>

</html>
