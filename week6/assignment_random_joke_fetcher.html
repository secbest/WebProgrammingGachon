<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Week 6 - Random Joke Fetcher</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            padding: 24px;
            text-align: center;
            max-width: 560px;
            margin: 0 auto;
        }

        button {
            padding: 10px 22px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            background: #1a56db;
            color: white;
            cursor: pointer;
        }

        button:disabled { opacity: 0.6; cursor: default; }
        #save-btn { background: #f59e0b; }

        #joke {
            margin: 24px 0;
            padding: 20px;
            min-height: 90px;
            border-radius: 12px;
            background: #eef2ff;
        }

        #setup { font-size: 1.2rem; font-weight: 700; margin: 0 0 8px; }
        #punchline { font-size: 1.1rem; color: #1a56db; margin: 0; }
        #error { color: #c0392b; font-weight: 600; }

        .spinner {
            width: 32px;
            height: 32px;
            margin: 0 auto 8px;
            border: 4px solid #c8d4f0;
            border-top-color: #1a56db;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        #favourite { margin-top: 28px; text-align: left; }
        #favourite h3 { margin-bottom: 8px; }
        #favourite p { margin: 4px 0; }
        .hidden { display: none; }
    </style>
</head>

<body>
    <h2>Random Joke Fetcher</h2>
    <button id="joke-btn">Get a Joke</button>
    <button id="save-btn" class="hidden">⭐ Save Favourite</button>

    <div id="joke" aria-live="polite">
        <p>Click the button to load a joke!</p>
    </div>

    <div id="favourite" class="hidden">
        <h3>⭐ Favourite Joke</h3>
        <p id="fav-setup"></p>
        <p id="fav-punchline"></p>
    </div>

    <script>
        const API_URL = 'https://official-joke-api.appspot.com/random_joke';
        const FAV_KEY = 'favouriteJoke';

        const jokeBtn = document.querySelector('#joke-btn');
        const saveBtn = document.querySelector('#save-btn');
        const jokeBox = document.querySelector('#joke');
        const favBox = document.querySelector('#favourite');

        let currentJoke = null;

        async function loadJoke() {
            // Loading state: text + spinner
            jokeBtn.disabled = true;
            saveBtn.classList.add('hidden');
            jokeBox.innerHTML = '<div class="spinner"></div><p>Loading...</p>';

            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const data = await response.json();

                currentJoke = { setup: data.setup, punchline: data.punchline };

                // Setup and punchline in separate elements
                jokeBox.innerHTML = '';
                const setup = document.createElement('p');
                setup.id = 'setup';
                setup.textContent = data.setup;
                const punchline = document.createElement('p');
                punchline.id = 'punchline';
                punchline.textContent = data.punchline;
                jokeBox.append(setup, punchline);

                saveBtn.textContent = '⭐ Save Favourite';
                saveBtn.classList.remove('hidden');
            } catch (err) {
                console.error(err);
                currentJoke = null;
                jokeBox.innerHTML = '<p id="error">Oops! We couldn\'t fetch a joke right now. Please check your connection and try again.</p>';
            } finally {
                jokeBtn.disabled = false;
            }
        }

        // Extra credit: save favourite to localStorage
        function showFavourite() {
            try {
                const fav = JSON.parse(localStorage.getItem(FAV_KEY));
                if (fav && fav.setup) {
                    document.querySelector('#fav-setup').textContent = fav.setup;
                    document.querySelector('#fav-punchline').textContent = fav.punchline;
                    favBox.classList.remove('hidden');
                    return;
                }
            } catch (e) { }
            favBox.classList.add('hidden');
        }

        function saveFavourite() {
            if (!currentJoke) return;
            localStorage.setItem(FAV_KEY, JSON.stringify(currentJoke));
            saveBtn.textContent = '✅ Saved!';
            showFavourite();
        }

        jokeBtn.addEventListener('click', loadJoke);
        saveBtn.addEventListener('click', saveFavourite);
        showFavourite();
    </script>
</body>

</html>
