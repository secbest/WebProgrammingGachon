<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Week 6 Friday v1 - E2 Real-time Email Validation</title>
    <style>
        body { font-family: system-ui; padding: 28px; max-width: 400px; margin: 0 auto; }
        label { font-size: 13px; font-weight: 600; display: block; margin-bottom: 4px; }
        input {
            width: 100%; padding: 10px 14px; border: 2px solid #c8d4f0;
            border-radius: 8px; font-size: 14px; outline: none; transition: all .2s;
        }
        input.valid-ok  { border-color: #16a34a; background: #f0fdf4; }
        input.valid-err { border-color: #dc2626; background: #fef2f2; }
        .error-msg { font-size: 12px; font-weight: 600; color: #dc2626;
            min-height: 18px; margin-top: 4px; }
        .ok-msg { font-size: 12px; font-weight: 600; color: #16a34a; min-height: 18px; margin-top: 4px; }
        .back { display: inline-block; margin-bottom: 16px; color: #1a56db; text-decoration: none; font-size: 14px; }
    </style>
</head>

<body>
    <a class="back" href="../index.html">← Week 6</a>
    <h2>Email Validation</h2>
    <label for="rt-email">Email Address</label>
    <input type="email" id="rt-email" required placeholder="name@example.com">
    <div class="error-msg" id="email-err" aria-live="polite"></div>
    <div class="ok-msg" id="email-ok" aria-live="polite"></div>

    <script>
        const emailInput = document.querySelector('#rt-email');
        const errEl = document.querySelector('#email-err');
        const okEl = document.querySelector('#email-ok');

        emailInput.addEventListener('input', () => {
            const v = emailInput.validity;
            const isEmpty = emailInput.value === '';

            if (isEmpty) {
                // Back to a neutral state when the field is emptied again
                emailInput.classList.remove('valid-ok', 'valid-err');
                errEl.textContent = '';
                okEl.textContent = '';
            } else if (v.valid) {
                emailInput.classList.add('valid-ok');
                emailInput.classList.remove('valid-err');
                errEl.textContent = '';
                okEl.textContent = '✓ Looks good!';
            } else {
                emailInput.classList.add('valid-err');
                emailInput.classList.remove('valid-ok');
                okEl.textContent = '';
                // valueMissing can't happen while typing, but handle it anyway
                if (v.valueMissing) errEl.textContent = 'Email is required';
                else if (v.typeMismatch) errEl.textContent = 'Not a valid email format';
                else errEl.textContent = 'Invalid email';
            }
        });
    </script>
</body>

</html>
