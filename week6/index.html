<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Week 6 - Web Programming</title>
  <style>
    :root { --text: #e6ecff; --muted: #94a3d6; --accent: #6ee7ff; --accent-2: #a78bfa; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 24px; display: grid; place-items: center; overflow-x: hidden;
      font-family: "Inter", "Segoe UI", Arial, sans-serif; color: var(--text);
      background: radial-gradient(ellipse at 50% 120%, #2a1a5e 0%, #0a1030 55%, #04061a 100%) fixed;
    }
    /* twinkling starfield (two layers) */
    body::before, body::after {
      content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; animation: twinkle 4s ease-in-out infinite alternate;
      background-repeat: repeat;
    }
    body::before {
      background-image: radial-gradient(1.5px 1.5px at 20px 30px, #fff, transparent), radial-gradient(1px 1px at 90px 120px, #bcd, transparent),
        radial-gradient(1.5px 1.5px at 160px 60px, #fff, transparent), radial-gradient(1px 1px at 230px 180px, #cdf, transparent);
      background-size: 260px 220px;
    }
    body::after {
      background-image: radial-gradient(2px 2px at 60px 90px, #fff, transparent), radial-gradient(1px 1px at 200px 20px, #fff, transparent),
        radial-gradient(1.5px 1.5px at 120px 190px, #9ef, transparent);
      background-size: 340px 280px; animation-duration: 6s; animation-direction: alternate-reverse;
    }
    @keyframes twinkle { from { opacity: .35; } to { opacity: 1; } }
    .container {
      position: relative; width: min(900px, 100%); padding: 32px; border-radius: 24px;
      background: rgba(12,18,52,.72); border: 1px solid rgba(110,231,255,.25);
      box-shadow: 0 0 60px rgba(110,231,255,.12), inset 0 0 40px rgba(167,139,250,.08); backdrop-filter: blur(10px);
      animation: warp .9s cubic-bezier(.2,.9,.3,1) both;
    }
    @keyframes warp { from { opacity: 0; transform: scale(.85) translateY(30px); filter: blur(8px); } }
    /* glowing planet */
    .container::after {
      content: ""; position: absolute; top: 22px; right: 26px; width: 22px; height: 22px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fff, var(--accent-2)); box-shadow: 0 0 18px var(--accent-2); animation: pulse 3s ease-in-out infinite;
    }
    @keyframes pulse { 50% { transform: scale(1.35); box-shadow: 0 0 34px var(--accent-2); } }
    .header { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; padding-right: 40px; }
    h1 {
      margin: 0; font-size: 2rem; background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--accent)); background-size: 200% auto;
      -webkit-background-clip: text; background-clip: text; color: transparent; animation: shine 5s linear infinite;
    }
    @keyframes shine { to { background-position: 200% center; } }
    .back-link { color: var(--accent); text-decoration: none; font-weight: 600; transition: transform .25s, text-shadow .25s; display: inline-block; }
    .back-link:hover { transform: translateX(-6px); text-shadow: 0 0 12px var(--accent); }
    #search {
      width: 100%; padding: 13px 16px; margin-bottom: 20px; font-size: 1rem; color: var(--text);
      background: rgba(255,255,255,.05); border: 1px solid rgba(110,231,255,.3); border-radius: 12px; transition: box-shadow .25s, border-color .25s;
    }
    #search::placeholder { color: var(--muted); }
    #search:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px rgba(110,231,255,.2), 0 0 24px rgba(110,231,255,.3); }
    .link-list { display: grid; gap: 12px; }
    .item-link {
      position: relative; display: block; padding: 15px 18px 15px 48px; border-radius: 14px; color: var(--text); text-decoration: none; font-weight: 500;
      background: linear-gradient(90deg, rgba(110,231,255,.14), rgba(167,139,250,.1)); border: 1px solid rgba(110,231,255,.2);
      opacity: 0; animation: emerge .6s ease forwards; transition: transform .25s, border-color .25s, box-shadow .25s;
    }
    /* radar-ping dot */
    .item-link::before {
      content: ""; position: absolute; left: 20px; top: 50%; width: 10px; height: 10px; margin-top: -5px; border-radius: 50%;
      background: var(--accent); box-shadow: 0 0 0 0 rgba(110,231,255,.7); animation: ping 2s infinite;
    }
    @keyframes ping { to { box-shadow: 0 0 0 14px rgba(110,231,255,0); } }
    .item-link:hover { transform: translateY(-3px) scale(1.015); border-color: var(--accent); box-shadow: 0 10px 30px rgba(110,231,255,.25); }
    @keyframes emerge { from { opacity: 0; transform: translateY(20px) scale(.96); } to { opacity: 1; } }
    #empty-state { margin-top: 14px; color: var(--muted); display: none; }
    .item-link:nth-child(1) { animation-delay: 0.50s; }
    .item-link:nth-child(2) { animation-delay: 0.60s; }
    .item-link:nth-child(3) { animation-delay: 0.70s; }
    .item-link:nth-child(4) { animation-delay: 0.80s; }
    .item-link:nth-child(5) { animation-delay: 0.90s; }
    .item-link:nth-child(6) { animation-delay: 1.00s; }
    .item-link:nth-child(7) { animation-delay: 1.10s; }
    .item-link:nth-child(8) { animation-delay: 1.20s; }
    .item-link:nth-child(9) { animation-delay: 1.30s; }
    .item-link:nth-child(10) { animation-delay: 1.40s; }
    .item-link:nth-child(11) { animation-delay: 1.50s; }
    .item-link:nth-child(12) { animation-delay: 1.60s; }

    /* ---- glassmorphism ---- */
    body {
      background:
        radial-gradient(circle at 18% 22%, rgba(110,231,255,.30), transparent 38%),
        radial-gradient(circle at 82% 70%, rgba(167,139,250,.35), transparent 42%),
        radial-gradient(ellipse at 50% 120%, #2a1a5e 0%, #0a1030 55%, #04061a 100%) fixed;
    }
    .container { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.22); backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%); box-shadow: 0 8px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.3); }
    .item-link, #search {
      background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.22); backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.25);
    }
    .item-link:hover { background: rgba(255,255,255,.16); box-shadow: 0 10px 30px rgba(110,231,255,.3), inset 0 1px 0 rgba(255,255,255,.4); }

    /* ---- unified soft glass palette (weeks 2-6) ---- */
    :root { --acc: #a5b4ff; --txt: #eef1ff; --soft: #aab3d6; --line: rgba(255,255,255,.18); --pane: rgba(255,255,255,.08); }
    body { background: linear-gradient(160deg, #0f1226, #181c3a 60%, #121631) fixed; color: var(--txt); animation: none; }
    body::before, body::after {
      content: ""; position: fixed; z-index: -1; pointer-events: none; mask-image: none; clip-path: none; transform: none;
      left: auto; right: auto; top: auto; bottom: auto; margin: 0; width: 46vmax; height: 46vmax; border-radius: 50%;
      filter: blur(90px); opacity: .28; background: none; animation: gdrift 24s ease-in-out infinite alternate;
    }
    body::before { background-color: #6366f1; top: -14vmax; left: -12vmax; }
    body::after { background-color: #14b8a6; bottom: -16vmax; right: -12vmax; animation-duration: 30s; animation-direction: alternate-reverse; }
    @keyframes gdrift { to { transform: translate(10vmax, 6vmax) scale(1.15); } }
    h1 {
      color: #fff; background: none; border: 0; box-shadow: none; padding: 0; border-radius: 0; transform: none;
      -webkit-text-fill-color: #fff; text-shadow: 0 2px 20px rgba(165,180,255,.35); animation: none;
    }
    h2 { color: var(--acc); background: none; border: 0; box-shadow: none; padding: 0; text-shadow: none; }
    .container, .section, .item-link, #search, .back-link {
      color: var(--txt); background: var(--pane); border: 1px solid var(--line);
      box-shadow: 0 8px 32px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.2);
      backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); text-shadow: none;
    }
    .container { border-radius: 26px; }
    .section { border-radius: 20px; transform: none; }
    .section:nth-child(1), .section:nth-child(2) { background: var(--pane); border-color: var(--line); transform: none; }
    .item-link { border-radius: 14px; font-weight: 500; }
    .item-link::before { color: var(--acc); }
    .item-link:hover, .item-link:hover::before {
      color: #fff; background: rgba(255,255,255,.16); border-color: var(--acc);
      box-shadow: 0 10px 30px rgba(99,102,241,.35), inset 0 1px 0 rgba(255,255,255,.3);
    }
    .back-link { color: var(--acc); border-radius: 999px; padding: 8px 16px; font-weight: 600; }
    .back-link:hover { color: #fff; border-color: var(--acc); }
    #search { border-radius: 14px; }
    #search::placeholder { color: var(--soft); }
    #search:focus { border-color: var(--acc); box-shadow: 0 0 0 4px rgba(165,180,255,.2); }
    #empty-state { color: var(--soft); }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main class="container">
    <div class="header">
      <h1>Week 6</h1>
      <a class="back-link" href="../index.html">← Back to Main</a>
    </div>

    <input id="search" type="search" placeholder="Filter exercises by title" aria-label="Filter links">

    <nav class="link-list" aria-label="Week 6 exercises">
      <a class="item-link" href="assignment_random_joke_fetcher.html">Assignment - Random Joke Fetcher (fetch API)</a>
    </nav>

    <p id="empty-state">No matching exercises found.</p>
  </main>

  <script>
    const search = document.getElementById("search");
    const links = [...document.querySelectorAll(".item-link")];
    const emptyState = document.getElementById("empty-state");

    search.addEventListener("input", (event) => {
      const query = event.target.value.trim().toLowerCase();
      let visibleCount = 0;

      links.forEach((link) => {
        const visible = link.textContent.toLowerCase().includes(query) || link.getAttribute("href").toLowerCase().includes(query);
        link.style.display = visible ? "block" : "none";
        if (visible) visibleCount += 1;
      });

      emptyState.style.display = visibleCount ? "none" : "block";
    });
  </script>
</body>
</html>
