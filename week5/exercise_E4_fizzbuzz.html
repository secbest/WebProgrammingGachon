<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Week 5 - E4 FizzBuzz (loop + conditions)</title>
    <style>
        #out { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 640px; margin: 20px auto; }
        .cell { min-width: 64px; padding: 8px; border-radius: 8px; background: #eef2ff; font-weight: 600; }
        .fizz { background: #bbf7d0; }
        .buzz { background: #bfdbfe; }
        .fizzbuzz { background: #fde68a; }
    </style>
</head>

<body style="font-family:system-ui;padding:24px;text-align:center">
    <h2>FizzBuzz</h2>
    <p>Multiples of 3 → Fizz, multiples of 5 → Buzz, both → FizzBuzz.</p>
    <label>Count up to
        <input id="limit" type="number" value="30" min="1" max="200"
            style="padding:8px;font-size:16px;border:1px solid #ccc;border-radius:8px;width:80px">
    </label>
    <button id="run" style="
    padding:10px 22px;font-size:16px;border:none;
    background:#1a56db;color:white;border-radius:8px;cursor:pointer">
        Run
    </button>

    <div id="out"></div>
    <p id="summary" style="color:#666"></p>

    <script>
        const out = document.querySelector('#out');
        const summary = document.querySelector('#summary');
        const limitInput = document.querySelector('#limit');

        function run() {
            const limit = Math.min(Math.max(Math.floor(Number(limitInput.value)) || 1, 1), 200);
            out.innerHTML = '';
            let sum = 0;

            for (let i = 1; i <= limit; i++) {
                let text, cls = '';
                // Check the "both" case first, otherwise it would never be reached
                if (i % 15 === 0) {
                    text = 'FizzBuzz'; cls = 'fizzbuzz';
                } else if (i % 3 === 0) {
                    text = 'Fizz'; cls = 'fizz';
                } else if (i % 5 === 0) {
                    text = 'Buzz'; cls = 'buzz';
                } else {
                    text = i;
                    sum += i; // running total of the plain numbers
                }

                const cell = document.createElement('div');
                cell.className = 'cell ' + cls;
                cell.textContent = text;
                out.appendChild(cell);
            }

            summary.textContent = 'Sum of the plain numbers: ' + sum;
        }

        document.querySelector('#run').addEventListener('click', run);
        run();
    </script>
</body>

</html>
