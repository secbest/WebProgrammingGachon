<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Programming - Gachon</title>
  <style>
    :root {
      --bg: #eef2ff; --surface: rgba(255,255,255,.7); --text: #1d2430; --muted: #5b6678;
      --primary: #5b5bf0; --primary-2: #ec4899; --border: rgba(255,255,255,.8);
      --shadow: 0 16px 48px rgba(60, 50, 160, .18);
      --glow-1: rgba(124,131,255,.35); --glow-2: rgba(255,122,198,.30);
    }
    :root.dark {
      --bg: #0b1020; --surface: rgba(24,32,54,.7); --text: #ebf0ff; --muted: #a7b2cc;
      --primary: #8ea2ff; --primary-2: #f472b6; --border: rgba(255,255,255,.12);
      --shadow: 0 16px 48px rgba(0,0,0,.5);
      --glow-1: rgba(59,75,216,.38); --glow-2: rgba(162,28,175,.30);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 24px;
      font-family: "Inter", "Segoe UI", Arial, sans-serif; color: var(--text);
      display: grid; place-items: center;
      /* static glows: no blur filters, no endless animation */
      background:
        radial-gradient(circle at 10% 8%, var(--glow-1), transparent 45%),
        radial-gradient(circle at 92% 95%, var(--glow-2), transparent 45%),
        var(--bg) fixed;
    }
    .container {
      width: min(760px, 100%); padding: 32px; border-radius: 28px;
      background: var(--surface); border: 1px solid var(--border);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      box-shadow: var(--shadow); animation: rise .5s ease both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(20px); } }
    .top-bar { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-bottom: 8px; flex-wrap: wrap; }
    h1 {
      margin: 0; font-size: 2rem; letter-spacing: -.5px;
      background: linear-gradient(90deg, var(--primary), var(--primary-2));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .sub { margin: 8px 0 22px; color: var(--muted); }
    #theme-toggle {
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
      border-radius: 999px; padding: 9px 16px; cursor: pointer; font-size: .9rem;
      transition: transform .2s;
    }
    #theme-toggle:hover { transform: scale(1.06); }
    #search {
      width: 100%; border: 1px solid var(--border); border-radius: 14px; padding: 13px 16px;
      font-size: 1rem; margin-bottom: 18px; background: var(--surface); color: var(--text);
      transition: box-shadow .2s, border-color .2s;
    }
    #search:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 25%, transparent); }
    .week-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; }
    .week-link {
      display: block; padding: 22px 16px; border-radius: 18px;
      color: var(--text); text-decoration: none; text-align: center; font-weight: 700; font-size: 1.1rem;
      background: linear-gradient(135deg, rgba(99,102,241,.28), rgba(20,184,166,.22));
      border: 1px solid rgba(255,255,255,.45);
      box-shadow: 0 6px 20px rgba(60,50,160,.2), inset 0 1px 0 rgba(255,255,255,.5);
      opacity: 0; animation: pop .45s ease forwards;
      transition: transform .2s, box-shadow .2s;
    }
    .week-link:hover { transform: translateY(-5px); box-shadow: 0 14px 30px rgba(236,72,153,.3), inset 0 1px 0 rgba(255,255,255,.6); }
    @keyframes pop { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    #empty-state { margin-top: 14px; color: var(--muted); display: none; text-align: center; }
    .week-link:nth-child(1) { animation-delay: .10s; }
    .week-link:nth-child(2) { animation-delay: .16s; }
    .week-link:nth-child(3) { animation-delay: .22s; }
    .week-link:nth-child(4) { animation-delay: .28s; }
    .week-link:nth-child(5) { animation-delay: .34s; }
    .week-link:nth-child(6) { animation-delay: .40s; }
    .week-link:nth-child(n+7) { animation-delay: .46s; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .week-link { opacity: 1; } }
  </style>
</head>
<body>
  <main class="container">
    <div class="top-bar">
      <h1>Web Programming Assignments</h1>
      <button id="theme-toggle" type="button" aria-label="Toggle theme">🌙 Dark</button>
    </div>
    <p class="sub">Select a week to view exercises and topic pages.</p>
    <input id="search" type="search" placeholder="Filter weeks or project (e.g. 2, 8, project)" aria-label="Filter week links">
    <nav class="week-grid" aria-label="Week navigation">
      <a class="week-link" href="week2/index.html" data-week="Week 2">Week 2</a>
      <a class="week-link" href="week3/index.html" data-week="Week 3">Week 3</a>
      <a class="week-link" href="week4/index.html" data-week="Week 4">Week 4</a>
      <a class="week-link" href="week5/index.html" data-week="Week 5">Week 5</a>
      <a class="week-link" href="week6/index.html" data-week="Week 6">Week 6</a>
      <a class="week-link" href="week7/index.html" data-week="Week 7">Week 7</a>
      <a class="week-link" href="week8/index.html" data-week="Week 8">Week 8</a>
      <a class="week-link" href="week9/index.html" data-week="Week 9">Week 9</a>
      <a class="week-link" href="project/index.html" data-week="Project">🏟️ Project</a>
    </nav>
    <p id="empty-state">No matching week found.</p>
  </main>
  <script>
    const root = document.documentElement;
    const toggle = document.getElementById("theme-toggle");
    const search = document.getElementById("search");
    const weekLinks = [...document.querySelectorAll(".week-link")];
    const emptyState = document.getElementById("empty-state");

    const setTheme = (theme) => {
      const dark = theme === "dark";
      root.classList.toggle("dark", dark);
      toggle.textContent = dark ? "☀️ Light" : "🌙 Dark";
      localStorage.setItem("theme", dark ? "dark" : "light");
    };

    setTheme(localStorage.getItem("theme") || "light");
    toggle.addEventListener("click", () => setTheme(root.classList.contains("dark") ? "light" : "dark"));

    search.addEventListener("input", (event) => {
      const query = event.target.value.trim().toLowerCase();
      let visibleCount = 0;

      weekLinks.forEach((link) => {
        const visible = link.dataset.week.toLowerCase().includes(query);
        link.style.display = visible ? "block" : "none";
        if (visible) visibleCount += 1;
      });

      emptyState.style.display = visibleCount ? "none" : "block";
    });
  </script>
</body>
</html>
