<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Programming - Gachon</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --surface: #ffffff;
      --text: #1d2430;
      --muted: #5b6678;
      --primary: #2455f5;
      --primary-hover: #1a45d1;
      --border: #d8e0ee;
      --shadow: 0 10px 30px rgba(20, 35, 70, 0.08);
    }
    :root.dark {
      --bg: #121826;
      --surface: #1b2436;
      --text: #ebf0ff;
      --muted: #a7b2cc;
      --primary: #7aa2ff;
      --primary-hover: #5c89ff;
      --border: #2f3c56;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      font-family: "Inter", "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
    }
    .container {
      width: min(760px, 100%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 28px;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }
    h1 { margin: 0; font-size: 1.8rem; }
    .sub {
      margin: 8px 0 20px;
      color: var(--muted);
      font-size: 0.95rem;
    }
    #theme-toggle {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      border-radius: 999px;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    #theme-toggle:hover { border-color: var(--primary); color: var(--primary); }
    #search {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 0.98rem;
      margin-bottom: 16px;
      background: transparent;
      color: var(--text);
    }
    #search:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 20%, transparent);
    }
    .week-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
    }
    .week-link {
      display: block;
      padding: 16px;
      border-radius: 14px;
      background: var(--primary);
      color: #fff;
      text-decoration: none;
      text-align: center;
      font-weight: 600;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .week-link:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
    }
    #empty-state {
      margin-top: 14px;
      color: var(--muted);
      display: none;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="top-bar">
      <h1>Web Programming Assignments</h1>
      <button id="theme-toggle" type="button" aria-label="Toggle theme">🌙 Dark</button>
    </div>
    <p class="sub">Select a week to view exercises and topic pages.</p>
    <input id="search" type="search" placeholder="Filter weeks (e.g. 2, 3, 4)" aria-label="Filter week links">
    <nav class="week-grid" aria-label="Week navigation">
      <a class="week-link" href="week2/index.html" data-week="Week 2">Week 2</a>
      <a class="week-link" href="week3/index.html" data-week="Week 3">Week 3</a>
      <a class="week-link" href="week4/index.html" data-week="Week 4">Week 4</a>
    </nav>
    <p id="empty-state">No matching week found.</p>
  </main>
  <script>
    const root = document.documentElement;
    const toggle = document.getElementById("theme-toggle");
    const search = document.getElementById("search");
    const weekLinks = [...document.querySelectorAll(".week-link")];
    const emptyState = document.getElementById("empty-state");

    const setTheme = (theme) => {
      const dark = theme === "dark";
      root.classList.toggle("dark", dark);
      toggle.textContent = dark ? "☀️ Light" : "🌙 Dark";
      localStorage.setItem("theme", dark ? "dark" : "light");
    };

    setTheme(localStorage.getItem("theme") || "light");
    toggle.addEventListener("click", () => setTheme(root.classList.contains("dark") ? "light" : "dark"));

    search.addEventListener("input", (event) => {
      const query = event.target.value.trim().toLowerCase();
      let visibleCount = 0;

      weekLinks.forEach((link) => {
        const visible = link.dataset.week.toLowerCase().includes(query);
        link.style.display = visible ? "block" : "none";
        if (visible) visibleCount += 1;
      });

      emptyState.style.display = visibleCount ? "none" : "block";
    });
  </script>
</body>
</html>
